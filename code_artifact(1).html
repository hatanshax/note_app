                const textX = editingText ? editingText.x : pos.x;
                const textY = editingText ? editingText.y : pos.y;
                const inputLeft = Math.min(textX, Math.max(0, container.clientWidth - 280));
                const inputTop = Math.min(textY, Math.max(0, container.clientHeight - 80));
                let cancelled = false;

                state.selectedTextId = editingText ? editingText.id : null;
                state.textSize = fontSize;
                document.getElementById('textSize').value = fontSize;
                document.getElementById('textSizeValue').innerText = `${fontSize}px`;
                textInput.value = editingText ? editingText.text : '';
                textInput.style.left = `${inputLeft}px`;
                textInput.style.top = `${inputTop}px`;
                textInput.style.height = 'auto';
                textInput.style.fontSize = `${fontSize}px`;
                textInput.style.lineHeight = '1.25';
                textInput.style.fontFamily = getTextFontStack();
                textInput.style.color = textColor;
                textInput.classList.remove('hidden');
                // mousedown本来のフォーカス処理が終わった後で入力欄へフォーカスする
                requestAnimationFrame(() => {
                    if (!textInput.classList.contains('hidden')) {
                        textInput.focus({ preventScroll: true });
                    }
                });

                const commitText = () => {
                    const text = textInput.value.trimEnd();
                    if (!cancelled) {
                        if (editingText) {
                            if (text.trim()) {
                                editingText.text = text;
                                editingText.size = fontSize;
                                state.selectedTextId = editingText.id;
                            } else {
                                state.textObjects = state.textObjects.filter(item => item.id !== editingText.id);
                                state.selectedTextId = null;
                            }
                        } else if (text.trim()) {
                            const newText = {
                                id: `text_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`,
                                text,
                                x: textX,
                                y: textY,
                                size: fontSize,
                                color: state.color,
                                colorIsDefault: state.colorIsDefault
                            };
                            state.textObjects.push(newText);
                            state.selectedTextId = newText.id;
                        }
                        renderTextObjects();
                        showSelectedTextOutline(state.textObjects.find(item => item.id === state.selectedTextId));
                        saveHistory();
                        syncCurrentNoteToMemory();
                    } else if (editingText) {
                        showSelectedTextOutline(editingText);
                    }
                    textInput.value = '';
                    textInput.classList.add('hidden');
                    textInput.oninput = null;
                    textInput.onkeydown = null;
                };

                textInput.addEventListener('blur', commitText, { once: true });
                textInput.onkeydown = (k) => {
                    if (k.key === 'Escape') {
                        k.preventDefault();
                        cancelled = true;
                        textInput.blur();
                    } else if (k.key === 'Enter' && (k.ctrlKey || k.metaKey)) {
                        k.preventDefault();
                        textInput.blur();
                    }
                };
                textInput.oninput = () => {
                    textInput.style.height = 'auto';
                    textInput.style.height = `${Math.min(textInput.scrollHeight, 180)}px`;
                };
            }

            // --- 履歴 (Undo / Redo) 管理 ---
            function captureInkState() {
                return {
                    autoInk: autoInkCanvas.toDataURL(),
                    customInk: canvas.toDataURL(),
                    texts: state.textObjects.map(textObject => ({ ...textObject }))
                };
            }

            function loadImageDataUrl(dataUrl, targetCtx) {
                if (!dataUrl) return Promise.resolve();
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => {
                        targetCtx.drawImage(img, 0, 0);
                        resolve();
                    };
                    img.onerror = reject;
                    img.src = dataUrl;
                });
            }

            function loadInkState(inkState) {
                clearSelection();
                state.selectedTextId = null;
                state.textObjects = [];
                customCtx.clearRect(0, 0, canvas.width, canvas.height);
                autoInkCtx.clearRect(0, 0, autoInkCanvas.width, autoInkCanvas.height);
                textCtx.clearRect(0, 0, textCanvas.width, textCanvas.height);

                if (typeof inkState === 'string') {
                    // 旧形式は色の意味を判別できないため固定色レイヤーとして読み込む
                    return new Promise((resolve, reject) => {
                        const img = new Image();
                        img.onload = () => {
                            drawStoredPage(img);
                            resolve();
                        };
                        img.onerror = reject;
                        img.src = inkState;
                    });
                }

                if (inkState && typeof inkState === 'object') {
                    state.textObjects = Array.isArray(inkState.texts)
                        ? inkState.texts.map(textObject => ({ ...textObject }))
                        : [];
                    renderTextObjects();
                    return Promise.all([
                        loadImageDataUrl(inkState.autoInk, autoInkCtx),
                        loadImageDataUrl(inkState.customInk, customCtx)
                    ]);
                }
                return Promise.resolve();
            }

            function saveHistory() {
                if (state.historyStep < state.history.length - 1) {
                    state.history = state.history.slice(0, state.historyStep + 1);
                }
                
                state.history.push(captureInkState());
                if (state.history.length > state.maxHistory) {
                    state.history.shift();
                } else {
                    state.historyStep++;
                }
                updateHistoryButtons();
            }

            function undo() {
                clearSelection();
                if (state.historyStep > 0) {
                    state.historyStep--;
                    loadHistoryState();
                } else if (state.historyStep === 0) {
                    state.historyStep = -1;
                    customCtx.clearRect(0, 0, canvas.width, canvas.height);
                    autoInkCtx.clearRect(0, 0, autoInkCanvas.width, autoInkCanvas.height);
                    textCtx.clearRect(0, 0, textCanvas.width, textCanvas.height);
                    state.textObjects = [];
                    state.selectedTextId = null;
                    updateHistoryButtons();
                    syncCurrentNoteToMemory();
                }
            }

            function redo() {
                if (state.historyStep < state.history.length - 1) {
                    state.historyStep++;
                    loadHistoryState();
                }
            }

            function loadHistoryState() {
                loadInkState(state.history[state.historyStep]).then(() => {
                    updateHistoryButtons();
                    syncCurrentNoteToMemory();
                }).catch(error => console.error('履歴の読み込み失敗:', error));
            }

            function updateHistoryButtons() {
                document.getElementById('undoBtn').disabled = (state.historyStep < 0);
                document.getElementById('redoBtn').disabled = (state.historyStep >= state.history.length - 1);
            }

            // --- ページ機能の管理 ---
            function saveCurrentPageData() {
                state.pages[state.currentPageIndex] = captureInkState();
            }

            function loadPageData(index) {
                state.currentPageIndex = index;
                renderBackground();
                customCtx.clearRect(0, 0, canvas.width, canvas.height);
                autoInkCtx.clearRect(0, 0, autoInkCanvas.width, autoInkCanvas.height);
                textCtx.clearRect(0, 0, textCanvas.width, textCanvas.height);
                state.textObjects = [];
                state.selectedTextId = null;
                state.history = [];
                state.historyStep = -1;

                if (state.pages[index]) {
                    loadInkState(state.pages[index]).then(() => {
                        saveHistory();
                        syncCurrentNoteToMemory();
                    }).catch(error => console.error('ページの読み込み失敗:', error));
                } else {
                    saveHistory();
                    syncCurrentNoteToMemory();
                }
                updatePageUI();
            }

            // v2以前は背景と筆跡が1枚の画像だったため、背景と同じ画素を透明化して移行する
            function drawStoredPage(img) {
                const legacyCanvas = document.createElement('canvas');
                legacyCanvas.width = img.naturalWidth;
                legacyCanvas.height = img.naturalHeight;
                const legacyCtx = legacyCanvas.getContext('2d', { willReadFrequently: true });
                legacyCtx.drawImage(img, 0, 0);

                const stored = legacyCtx.getImageData(0, 0, legacyCanvas.width, legacyCanvas.height);
                let looksFlattened = true;
                for (let i = 3; i < stored.data.length; i += 4) {
                    if (stored.data[i] < 255) {
                        looksFlattened = false;
                        break;
                    }
                }
                if (looksFlattened) {
                    const expectedCanvas = document.createElement('canvas');
                    expectedCanvas.width = legacyCanvas.width;
                    expectedCanvas.height = legacyCanvas.height;
                    const expectedCtx = expectedCanvas.getContext('2d', { willReadFrequently: true });
                    const storedIsDark = stored.data[0] + stored.data[1] + stored.data[2] < 384;
                    renderBackgroundTo(
                        expectedCtx,
                        expectedCanvas.width,
                        expectedCanvas.height,
                        state.bgType,
                        storedIsDark ? 'dark' : 'light'
                    );

                    const expected = expectedCtx.getImageData(0, 0, expectedCanvas.width, expectedCanvas.height);
                    for (let i = 0; i < stored.data.length; i += 4) {
                        if (stored.data[i] === expected.data[i] &&
                            stored.data[i + 1] === expected.data[i + 1] &&
                            stored.data[i + 2] === expected.data[i + 2]) {
                            stored.data[i + 3] = 0;
                        }
                    }
                    legacyCtx.clearRect(0, 0, legacyCanvas.width, legacyCanvas.height);
                }

                // 旧形式で使われていた既定色を、可能な範囲でモード連動レイヤーへ移行
                const migratedAuto = legacyCtx.createImageData(legacyCanvas.width, legacyCanvas.height);
                const legacyDefaultColors = new Set(['30,41,59', '15,23,42', '248,250,252']);
                for (let i = 0; i < stored.data.length; i += 4) {
                    const rgbKey = `${stored.data[i]},${stored.data[i + 1]},${stored.data[i + 2]}`;
                    if (stored.data[i + 3] > 0 && legacyDefaultColors.has(rgbKey)) {
                        migratedAuto.data[i] = 0;
                        migratedAuto.data[i + 1] = 0;
                        migratedAuto.data[i + 2] = 0;
                        migratedAuto.data[i + 3] = stored.data[i + 3];
                        stored.data[i + 3] = 0;
                    }
                }
                legacyCtx.clearRect(0, 0, legacyCanvas.width, legacyCanvas.height);
                legacyCtx.putImageData(stored, 0, 0);
                const migratedAutoCanvas = document.createElement('canvas');
                migratedAutoCanvas.width = legacyCanvas.width;
                migratedAutoCanvas.height = legacyCanvas.height;
                migratedAutoCanvas.getContext('2d').putImageData(migratedAuto, 0, 0);

                customCtx.drawImage(legacyCanvas, 0, 0);
                autoInkCtx.drawImage(migratedAutoCanvas, 0, 0);
            }

            function updatePageUI() {
                const currentChapter = getChapterAt(state.currentPageIndex);
                document.getElementById('pageIndicator').innerText = `${state.currentPageIndex + 1} / ${state.pages.length}${currentChapter ? ` · ${currentChapter.title}` : ''}`;

            // --- ノート一覧UI描画（フォルダー階層ブラウザ） ---
            function formatNoteDate(timestamp) {
                return new Date(timestamp).toLocaleString('ja-JP', {
                    month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                });
            }

            function getFolderPathLabel(folderId) {

            }

            function getExpandedFolderIds() {
                // 初回は全フォルダー展開。以降はユーザー操作で畳んだまま保持
                if (!state.folderTreeExpanded) {

                }
                return state.folderTreeExpanded;
            }

            function expandFolderPath(folderId) {
                if (!folderId) return;
                const expandedIds = getExpandedFolderIds();
                getFolderAncestry(folderId).forEach(folder => expandedIds.add(folder.id));
                expandedIds.add(folderId);

                const expandedIds = getExpandedFolderIds();

                row.className = `group flex items-center gap-2 p-2 rounded-xl cursor-pointer transition ${isSelected ? 'bg-blue-50 ring-1 ring-blue-400' : 'hover:bg-slate-100'}`;
                row.style.paddingLeft = `${12 + depth * 18}px`;

                    <i class="fa-solid fa-folder${isExpanded ? '-open' : ''} ${isSelected ? 'text-blue-500' : 'text-amber-500'} shrink-0"></i>

                    <span class="text-[10px] text-slate-400 shrink-0"><i class="fa-regular fa-file-lines mr-0.5"></i>${notes}</span>

                    <div class="hidden group-hover:flex items-center gap-0.5 shrink-0">
                        <button class="rename-folder-btn text-slate-400 hover:text-blue-600 p-1.5 rounded-lg hover:bg-blue-50 transition" title="フォルダー名を変更">
                            <i class="fa-solid fa-pen text-xs"></i>
                        </button>
                        <button class="move-folder-btn text-slate-400 hover:text-blue-600 p-1.5 rounded-lg hover:bg-blue-50 transition" title="移動先を変更">
                            <i class="fa-solid fa-arrow-right-arrow-left text-xs"></i>
                        </button>
                        <button class="delete-folder-btn text-rose-400 hover:text-rose-600 p-1.5 rounded-lg hover:bg-rose-50 transition" title="フォルダー削除">

                row.addEventListener('click', (e) => {

                row.style.paddingLeft = `${12 + depth * 18 + 15}px`;
                row.innerHTML = `
                    <i class="fa-regular fa-file-lines ${isSelected ? 'text-blue-500' : 'text-slate-400'} text-sm shrink-0"></i>

                    <span class="text-[10px] text-slate-400 shrink-0">${note.pages ? note.pages.length : 1}p</span>

                    <span class="text-[10px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full uppercase shrink-0 hidden lg:inline">${note.bgType || 'grid'}</span>
                    <div class="hidden group-hover:flex items-center gap-0.5 shrink-0">
                        <button class="move-note-btn text-slate-400 hover:text-blue-600 p-1.5 rounded-lg hover:bg-blue-50 transition" title="移動先を変更">
                            <i class="fa-solid fa-arrow-right-arrow-left text-xs"></i>

                        <button class="delete-note-btn text-rose-400 hover:text-rose-600 p-1.5 rounded-lg hover:bg-rose-50 transition" title="ノート削除">
                            <i class="fa-regular fa-trash-can text-xs"></i>

            function renderHierarchyTree() {
                const treeEl = document.getElementById('hierarchyTree');
                treeEl.innerHTML = '';
                const expandedIds = getExpandedFolderIds();

                // ルート（ホーム）選択行
                const isRootSelected = !(state.modalFolderId || null);
                const rootRow = document.createElement('div');
                rootRow.className = `group flex items-center gap-2 p-2 rounded-xl cursor-pointer transition ${isRootSelected ? 'bg-blue-50 ring-1 ring-blue-400' : 'hover:bg-slate-100'}`;
                rootRow.innerHTML = `
                    <i class="fa-solid fa-house w-3 text-center text-[11px] ${isRootSelected ? 'text-blue-500' : 'text-slate-400'} shrink-0"></i>
                    <span class="font-bold text-slate-800 text-sm">ホーム</span>
                    <span class="text-[10px] text-slate-400 ml-auto font-bold">${state.notesList.length}ノート</span>
                `;
                rootRow.addEventListener('click', () => {
                    state.modalFolderId = null;
                    renderHierarchyTree();
                });
                treeEl.appendChild(rootRow);

                const renderLevel = (parentId, depth) => {
                    getChildFolders(parentId).forEach(folder => {
                        treeEl.appendChild(createFolderTreeRow(folder, depth));
                        if (expandedIds.has(folder.id)) renderLevel(folder.id, depth + 1);
                    });
                    getNotesInFolder(parentId).forEach(note => treeEl.appendChild(createNoteTreeRow(note, depth)));
                };
                renderLevel(null, 1);

                if (treeEl.children.length === 1) {
                    const emptyEl = document.createElement('p');
                    emptyEl.className = 'text-center text-sm text-slate-400 py-10';
                    emptyEl.innerHTML = '<i class="fa-regular fa-folder-open text-2xl block mb-2"></i>ノートもフォルダーもありません';
                    treeEl.appendChild(emptyEl);
                }

            // --- 移動先選択ダイアログ ---
            function openMoveDialog(itemType, itemId) {
                state.moveContext = { type: itemType, id: itemId };
                const list = document.getElementById('moveTargetList');
                list.innerHTML = '';

                const currentParentId = itemType === 'note'
                    ? (state.notesList.find(n => n.id === itemId) || {}).parentId || null
                    : (getFolderById(itemId) || {}).parentId || null;

                const appendTarget = (label, icon, targetId, disabled) => {
                    const row = document.createElement('button');
                    row.type = 'button';
                    row.className = `flex items-center gap-2 px-3 py-2 rounded-xl border text-sm font-medium text-left transition ${
                        disabled
                            ? 'border-slate-100 text-slate-300 cursor-not-allowed'
                            : 'border-slate-200 text-slate-700 hover:border-blue-500 hover:bg-blue-50'
                    }`;
                    row.innerHTML = `<i class="fa-solid ${icon} text-blue-600 shrink-0"></i><span class="truncate">${label}</span>`;
                    if (!disabled) {
                        row.addEventListener('click', () => {
                            if (state.moveContext.type === 'note') {
                                moveNoteToFolder(state.moveContext.id, targetId);
                            } else {
                                moveFolderToFolder(state.moveContext.id, targetId);
                            }
                            closeMoveDialog();
                            expandFolderPath(targetId);
                            renderHierarchyTree();
                        });
                    }
                    list.appendChild(row);
                };

                // ルート（ホーム）は常に選択可能
                appendTarget('ホーム', 'fa-house', null, currentParentId === null);

                state.folders.forEach(folder => {
                    // 現在位置は選択不可。フォルダー移動時は自分とその子孫も不可
                    const isCurrent = folder.id === currentParentId;
                    const isSelfOrDescendant = state.moveContext.type === 'folder' && isFolderDescendant(folder.id, itemId);
                    appendTarget(getFolderPathLabel(folder.id), 'fa-folder', folder.id, isCurrent || isSelfOrDescendant);
                });

                document.getElementById('moveItemModal').classList.remove('hidden');
                document.getElementById('moveItemModal').classList.add('flex');

            function closeMoveDialog() {
                const modal = document.getElementById('moveItemModal');
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                state.moveContext = null;
            }

            function openNotesModal() {
                syncCurrentNoteToMemory();
                // 現在開いているノートがあるフォルダーを選択状態にする
                const currentNote = state.notesList.find(n => n.id === state.currentNoteId);
                state.modalFolderId = (currentNote && currentNote.parentId) || null;
                expandFolderPath(state.modalFolderId);
                renderHierarchyTree();
                document.getElementById('notesModal').classList.remove('hidden');

                document.getElementById('notesModal').classList.add('hidden');

            // --- 全ノートのデータ保存 / インポート ---
            function exportNotesData() {
                syncCurrentNoteToMemory();
                const backup = {
                    version: BACKUP_VERSION,
                    exportedAt: new Date().toISOString(),
                    folders: state.folders,
                    notes: state.notesList
                };
                const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `handwritten_notes_backup_${Date.now()}.json`;
                document.body.appendChild(link);
                link.click();
                link.remove();
                setTimeout(() => URL.revokeObjectURL(url), 0);
            }

            function normalizeImportedNotes(rawNotes, validFolderIds) {
                // 以前の配列形式のバックアップにも対応
                if (!Array.isArray(rawNotes) || rawNotes.length === 0) {
                    throw new Error('ノートデータが見つかりません');
                }

                return rawNotes.map((note, index) => {
                    if (!note || typeof note !== 'object') {
                        throw new Error(`${index + 1}件目のノート形式が不正です`);
                    }
                    const pages = Array.isArray(note.pages) && note.pages.length > 0
                        ? note.pages.map(page => {
                            if (typeof page === 'string' || page === null) return page;
                            if (page && typeof page === 'object') {
                                return {
                                    autoInk: typeof page.autoInk === 'string' ? page.autoInk : null,
                                    customInk: typeof page.customInk === 'string' ? page.customInk : null,
                                    texts: Array.isArray(page.texts) ? page.texts
                                        .filter(item => item && typeof item.text === 'string')
                                        .map((item, textIndex) => ({
                                            id: typeof item.id === 'string' ? item.id : `text_import_${index}_${textIndex}`,
                                            text: item.text,
                                            x: Number.isFinite(item.x) ? item.x : 0,
                                            y: Number.isFinite(item.y) ? item.y : 0,
                                            size: Number.isFinite(item.size) ? Math.max(10, Math.min(96, item.size)) : 24,
                                            color: typeof item.color === 'string' ? item.color : '#0f172a',
                                            colorIsDefault: item.colorIsDefault !== false
                                        })) : []
                                };
                            }
                            return null;
                        })
                        : [null];
                    const requestedIndex = Number.isInteger(note.currentPageIndex) ? note.currentPageIndex : 0;
                    return {
                        id: typeof note.id === 'string' && note.id ? note.id : `note_${Date.now()}_${index}`,
                        title: typeof note.title === 'string' && note.title.trim() ? note.title : '無題のノート',
                        bgType: VALID_BACKGROUNDS.has(note.bgType) ? note.bgType : 'grid',
                        pages,
                        currentPageIndex: Math.max(0, Math.min(requestedIndex, pages.length - 1)),
                        chapters: getValidatedChapters(note, pages),
                        parentId: typeof note.parentId === 'string' && validFolderIds.has(note.parentId) ? note.parentId : null,
                        updatedAt: Number.isFinite(note.updatedAt) ? note.updatedAt : Date.now()
                    };
                });
            }

            function normalizeImportedFolders(rawFolders) {
                const folders = (Array.isArray(rawFolders) ? rawFolders : [])
                    .map((folder, index) => {
                        if (!folder || typeof folder !== 'object') return null;
                        return {
                            id: typeof folder.id === 'string' && folder.id ? folder.id : `folder_${Date.now()}_${index}`,
                            title: typeof folder.title === 'string' && folder.title.trim() ? folder.title : '新しいフォルダー',
                            parentId: typeof folder.parentId === 'string' && folder.parentId ? folder.parentId : null,
                            updatedAt: Number.isFinite(folder.updatedAt) ? folder.updatedAt : Date.now()
                        };
                    })
                    .filter(Boolean);

                const folderIds = new Set(folders.map(f => f.id));
                folders.forEach(folder => {
                    if (folder.parentId && !folderIds.has(folder.parentId)) folder.parentId = null;
                    // 循環参照はルートに切り離す
                    const seen = new Set();
                    let cursor = folder.parentId;
                    while (cursor) {
                        if (seen.has(cursor) || cursor === folder.id) {
                            folder.parentId = null;
                            break;
                        }
                        seen.add(cursor);
                        cursor = (folders.find(f => f.id === cursor) || {}).parentId || null;
                    }
                });
                return folders;
            }

            function normalizeImportedData(parsed) {
                // 旧形式（ノート配列のみ）とv3形式（フォルダー付き）の両方に対応
                const rawNotes = Array.isArray(parsed) ? parsed : parsed && parsed.notes;
                const folders = normalizeImportedFolders(parsed && !Array.isArray(parsed) ? parsed.folders : []);
                const validFolderIds = new Set(folders.map(f => f.id));
                const notes = normalizeImportedNotes(rawNotes, validFolderIds);
                return { folders, notes };
            }

            function importNotesData(file, input) {
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const { folders, notes } = normalizeImportedData(JSON.parse(event.target.result));
                        if (!confirm('現在のノートとフォルダーを、インポートしたデータで置き換えますか？')) return;
                        state.folders = folders;
                        state.notesList = notes;
                        state.modalFolderId = null;
                        state.folderTreeExpanded = null;
                        saveAllNotesToStorage();
                        loadNoteById(state.notesList[0].id);
                        renderHierarchyTree();
                        alert(`${state.notesList.length}件のノートと${state.folders.length}件のフォルダーをインポートしました。`);
                    } catch(err) {
                        console.error('インポート失敗:', err);
                        alert('データをインポートできませんでした。正しいJSONバックアップを選択してください。');
                    } finally {
                        // 同じファイルを続けて選択できるようにする
                        input.value = '';
                    }
                };
                reader.onerror = () => {
                    alert('ファイルを読み込めませんでした。');
                    input.value = '';
                };
                reader.readAsText(file);
            }

            // --- イベントリスナー設定 ---

            function activateTool(tool) {
                if (tool !== 'select') clearSelection();
                if (tool !== 'text') state.selectedTextId = null;
                state.currentTool = tool;
                document.querySelectorAll('.tool-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.tool === tool);
                });
                container.className = `w-full h-full relative overflow-hidden ${
                    tool === 'eraser' ? 'cursor-eraser' :
                    tool === 'text' ? 'cursor-text' :
                    tool === 'select' ? 'cursor-select' : 'cursor-pen'
                }`;
            }

            // マウス & タッチイベント (キャンバス)
            canvas.addEventListener('mousedown', (e) => {
                if (e.button === 2) {
                    e.preventDefault();
                    state.toolBeforeRightErase = state.currentTool;
                    activateTool('eraser');
                }
                startDrawing(e);
            });
            canvas.addEventListener('contextmenu', (e) => e.preventDefault());
            window.addEventListener('mousemove', draw);
            window.addEventListener('mouseup', (e) => {
                stopDrawing();
                if (e.button === 2 && state.toolBeforeRightErase !== null) {
                    const previousTool = state.toolBeforeRightErase;
                    state.toolBeforeRightErase = null;
                    activateTool(previousTool);
                }
            });

            canvas.addEventListener('touchstart', startDrawing, { passive: false });
            window.addEventListener('touchmove', draw, { passive: false });
            window.addEventListener('touchend', stopDrawing);

            // ツール切り替えボタン
            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    activateTool(e.currentTarget.dataset.tool);
                });
            });

            // カスタムカラーピッカー
            document.getElementById('customColor').addEventListener('input', (e) => {
                updateDrawingColor(e.target.value, false);
            });

            document.getElementById('colorChoice').addEventListener('change', (e) => {
                if (e.target.value === 'default') {
                    updateDrawingColor(getDefaultDrawingColor(), true);
                } else {
                    updateDrawingColor(document.getElementById('customColor').value, false);
                    document.getElementById('customColor').click();
                }
            });

            document.getElementById('themeToggleBtn').addEventListener('click', () => {
                applyUiMode(state.uiMode === 'dark' ? 'light' : 'dark');
                syncCurrentNoteToMemory();
            });
            document.getElementById('uiHideToggleBtn').addEventListener('click', () => setUiHidden(!state.uiHidden));
            document.getElementById('uiShowBtn').addEventListener('click', () => setUiHidden(false));

            // 太さスライダー
            const widthInput = document.getElementById('lineWidth');
            const widthValue = document.getElementById('widthValue');
            widthInput.addEventListener('input', (e) => {
                state.lineWidth = parseInt(e.target.value);
                widthValue.innerText = `${state.lineWidth}px`;
            });

            const textSizeInput = document.getElementById('textSize');
            const textSizeValue = document.getElementById('textSizeValue');
            textSizeInput.addEventListener('input', (e) => {
                state.textSize = parseInt(e.target.value);
                textSizeValue.innerText = `${state.textSize}px`;
                const selectedText = state.textObjects.find(item => item.id === state.selectedTextId);
                if (selectedText) {
                    selectedText.size = state.textSize;
                    renderTextObjects();
                    showSelectedTextOutline(selectedText);
                }
            });
            textSizeInput.addEventListener('change', () => {
                if (state.textObjects.some(item => item.id === state.selectedTextId)) {
                    saveHistory();
                    syncCurrentNoteToMemory();
                }
            });

            const eraserWidthInput = document.getElementById('eraserWidth');
            const eraserWidthValue = document.getElementById('eraserWidthValue');
            eraserWidthInput.addEventListener('input', (e) => {
                state.eraserWidth = parseInt(e.target.value);
                eraserWidthValue.innerText = `${state.eraserWidth}px`;
            });

            // ノート背景の変更
            document.querySelectorAll('.bg-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.bg-btn').forEach(b => {
                        b.classList.remove('active');
                        b.setAttribute('aria-pressed', 'false');
                    });
                    e.currentTarget.classList.add('active');
                    e.currentTarget.setAttribute('aria-pressed', 'true');
                    state.bgType = e.currentTarget.dataset.bg;
                    if (state.colorIsDefault) updateDrawingColor(getDefaultDrawingColor(), true);

                    // 背景レイヤーだけを再描画し、筆跡には触れない
                    renderBackground();
                    syncCurrentNoteToMemory();
                });
            });

            // ノートタイトル編集イベント
            document.getElementById('noteTitle').addEventListener('input', () => {
                syncCurrentNoteToMemory();
            });

            // モーダル関連イベント
            document.getElementById('openNotesListBtn').addEventListener('click', openNotesModal);
            document.getElementById('closeNotesModalBtn').addEventListener('click', closeNotesModal);
            document.getElementById('modalCreateNoteBtn').addEventListener('click', () => {
                // 開いているフォルダーの中に新規ノートを作成
                createNewNote('無題のノート', 'grid', state.modalFolderId);
                closeNotesModal();
            });
            document.getElementById('newNoteQuickBtn').addEventListener('click', () => {
                createNewNote();
            });
            document.getElementById('modalCreateFolderBtn').addEventListener('click', () => {
                const title = prompt('新しいフォルダー名を入力', '新しいフォルダー');
                if (title && title.trim()) {
                    const folder = createFolder(title.trim(), state.modalFolderId);
                    state.modalFolderId = folder.id;
                    expandFolderPath(folder.id);
                    renderHierarchyTree();
                }
            });

            // 移動先選択ダイアログ
            document.getElementById('closeMoveDialogBtn').addEventListener('click', closeMoveDialog);
            document.getElementById('moveItemModal').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) closeMoveDialog();
            });

            // ノートバックアップ (JSON形式でのデータ保存/インポート)
            document.getElementById('exportNotesBtn').addEventListener('click', exportNotesData);
            document.getElementById('headerExportDataBtn').addEventListener('click', exportNotesData);
            ['importNotesInput', 'headerImportDataInput'].forEach(id => {
                const input = document.getElementById(id);
                input.addEventListener('change', () => importNotesData(input.files[0], input));
            });

            // Undo / Redo ボタン
            document.getElementById('undoBtn').addEventListener('click', undo);
            document.getElementById('redoBtn').addEventListener('click', redo);

            // 全消去
            document.getElementById('clearBtn').addEventListener('click', () => {
                clearSelection();
                customCtx.clearRect(0, 0, canvas.width, canvas.height);
                autoInkCtx.clearRect(0, 0, autoInkCanvas.width, autoInkCanvas.height);
                textCtx.clearRect(0, 0, textCanvas.width, textCanvas.height);
                state.textObjects = [];
                state.selectedTextId = null;
                saveHistory();
                syncCurrentNoteToMemory();
            });

            // ページ切替
            document.getElementById('prevPageBtn').addEventListener('click', () => {
                if (state.currentPageIndex > 0) {
                    saveCurrentPageData();
                    loadPageData(state.currentPageIndex - 1);
                }
            });

            document.getElementById('nextPageBtn').addEventListener('click', () => {
                if (state.currentPageIndex < state.pages.length - 1) {
                    saveCurrentPageData();
                    loadPageData(state.currentPageIndex + 1);
                }
            });

            document.getElementById('addPageBtn').addEventListener('click', () => {
                saveCurrentPageData();
                state.pages.push(null);
                loadPageData(state.pages.length - 1);
            });

            // 章アウトライン
            document.getElementById('chapterToggleBtn').addEventListener('click', () => {
                const panel = document.getElementById('chapterPanel');
                if (panel.classList.contains('hidden')) openChapterPanel();
                else closeChapterPanel();
            });
            document.getElementById('closeChapterPanelBtn').addEventListener('click', closeChapterPanel);
            document.getElementById('addChapterHereBtn').addEventListener('click', () => {
                const title = prompt('章名を入力', `第${state.chapters.length + 1}章`);
                if (title === null) return;
                startChapterAt(state.currentPageIndex, title);
            });
            document.getElementById('addChapterNewPageBtn').addEventListener('click', () => {
                const title = prompt('章名を入力', `第${state.chapters.length + 1}章`);
                if (title === null) return;
                saveCurrentPageData();
                state.pages.push(null);
                const newPageIndex = state.pages.length - 1;
                startChapterAt(newPageIndex, title);
                loadPageData(newPageIndex);
            });

            // 画像ダウンロード
            document.getElementById('downloadBtn').addEventListener('click', () => {
                const title = document.getElementById('noteTitle').value || 'note';
                const exportCanvas = document.createElement('canvas');
                exportCanvas.width = canvas.width;
                exportCanvas.height = canvas.height;
                const exportCtx = exportCanvas.getContext('2d');
                exportCtx.drawImage(backgroundCanvas, 0, 0);
                exportCtx.filter = (state.uiMode === 'dark' || state.bgType === 'dark') ? 'invert(1)' : 'none';
                exportCtx.drawImage(autoInkCanvas, 0, 0);
                exportCtx.filter = 'none';
                exportCtx.drawImage(canvas, 0, 0);
                exportCtx.drawImage(textCanvas, 0, 0);
                const link = document.createElement('a');
                link.download = `${title}_page${state.currentPageIndex + 1}.png`;
                link.href = exportCanvas.toDataURL('image/png');
                link.click();
            });

            // ショートカットキー対応
            window.addEventListener('keydown', (e) => {
                if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;

                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                    e.preventDefault();
                    undo();
                } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
                    e.preventDefault();
                    redo();
                } else if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'h') {
                    e.preventDefault();
                    setUiHidden(!state.uiHidden);
                } else if (e.key.toLowerCase() === 'p') {
                    document.querySelector('[data-tool="pen"]').click();
                } else if (e.key.toLowerCase() === 'h') {
                    document.querySelector('[data-tool="highlighter"]').click();
                } else if (e.key.toLowerCase() === 'e') {
                    document.querySelector('[data-tool="eraser"]').click();
                } else if (e.key.toLowerCase() === 't') {
                    document.querySelector('[data-tool="text"]').click();
                } else if (e.key.toLowerCase() === 's') {
                    document.querySelector('[data-tool="select"]').click();
                }
            });

            // ウィンドウサイズ変更対応
            window.addEventListener('resize', resizeCanvas);

            // --- アプリケーション起動 ---
            applyUiMode(localStorage.getItem(UI_MODE_KEY) || 'light', false);
            setUiHidden(localStorage.getItem(UI_HIDDEN_KEY) === 'true', false);
            resizeCanvas();
            loadAllNotesFromStorage();
        };
    </script>
</body>
</html>
