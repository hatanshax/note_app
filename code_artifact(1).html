<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Handwritten Canvas Note</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=STIX+Two+Text:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: none; /* 防止: モバイルでのスワイプスクロール */
            user-select: none;
            -webkit-user-select: none;
        }
        /* キャンバス要素のカーソルスタイリング */
        .cursor-pen { cursor: crosshair; }
        .cursor-eraser { cursor: cell; }
        .cursor-text { cursor: text; }
        .cursor-select { cursor: crosshair; }

        #selectionOverlay {
            border: 2px dashed #2563eb;
            background: rgba(59, 130, 246, 0.08);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.8) inset;
        }
        #selectionOverlay.moving {
            cursor: move;
            background: rgba(59, 130, 246, 0.14);
        }

        #canvasTextInput {
            user-select: text;
            -webkit-user-select: text;
            touch-action: manipulation;
        }
        
        /* カスタムスクロールバー */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        /* カスタムカラーピッカー */
        #customColor {
            appearance: none;
            -webkit-appearance: none;
            padding: 0;
            border: 0;
            background: transparent;
        }
        #customColor::-webkit-color-swatch-wrapper { padding: 2px; }
        #customColor::-webkit-color-swatch {
            border: 2px solid #ffffff;
            border-radius: 9999px;
            box-shadow: 0 0 0 1px #cbd5e1;
        }
        #customColor::-moz-color-swatch {
            border: 2px solid #ffffff;
            border-radius: 9999px;
            box-shadow: 0 0 0 1px #cbd5e1;
        }
        
        /* ツールボタンのアクティブ状態 */
        .tool-btn.active {
            background-color: #3b82f6;
            color: #ffffff;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.3);
        }

        .bg-btn.active {
            background-color: #2563eb;
            border-color: #2563eb;
            color: #ffffff;
            box-shadow: 0 2px 5px rgba(37, 99, 235, 0.25);
        }

        /* アプリのダークモード */
        body.dark-mode { background-color: #020617; }
        body.dark-mode .theme-header,
        body.dark-mode .theme-panel,
        body.dark-mode .theme-modal { background-color: rgba(15, 23, 42, 0.97) !important; border-color: #334155 !important; }
        body.dark-mode .theme-subpanel,
        body.dark-mode .bg-slate-50,
        body.dark-mode .bg-slate-100 { background-color: #1e293b !important; }
        body.dark-mode .bg-white { background-color: #0f172a !important; }
        body.dark-mode .border-slate-100,
        body.dark-mode .border-slate-200,
        body.dark-mode .border-slate-300 { border-color: #334155 !important; }
        body.dark-mode .text-slate-800,
        body.dark-mode .text-slate-700,
        body.dark-mode .text-slate-600 { color: #e2e8f0 !important; }
        body.dark-mode .text-slate-500,
        body.dark-mode .text-slate-400 { color: #94a3b8 !important; }
        body.dark-mode input,
        body.dark-mode textarea { color: #f8fafc; }
        body.dark-mode #canvasTextInput { background-color: rgba(15, 23, 42, 0.97) !important; }
        body.dark-mode #autoInkCanvas,
        body.canvas-dark-paper #autoInkCanvas { filter: invert(1); }

        /* 集中モード: floatingパネルを全域非表示にし、復元ボタンのみ残す */
        body.ui-hidden .hideable-panel { display: none !important; }
        /* 集中モードでも描画色の選択だけは残す */
        body.ui-hidden #propsBar > *:not(#colorPalette) { display: none !important; }
        #uiShowBtn {
            display: none;
            align-items: center;
            justify-content: center;
        }
        body.ui-hidden #uiShowBtn { display: flex; }
    </style>
</head>
<body class="h-full bg-slate-100 flex flex-col overflow-hidden select-none">

    <!-- トップヘッダー / ナビゲーションバー -->
    <header class="theme-header bg-white border-b border-slate-200 px-4 py-2 flex items-center justify-between shadow-sm z-20">
        <div class="flex items-center space-x-3">
            <!-- ノート一覧モーダルを開くボタン -->
            <button id="openNotesListBtn" class="bg-slate-100 hover:bg-slate-200 text-slate-700 p-2 rounded-xl transition flex items-center space-x-2" title="ノート一覧を開く">
                <i class="fa-solid fa-book-bookmark text-blue-600 text-lg"></i>
                <span class="text-xs font-semibold hidden md:inline">ノート一覧</span>
            </button>

            <button id="newNoteQuickBtn" class="bg-blue-50 hover:bg-blue-100 text-blue-600 p-2 rounded-xl transition text-xs font-semibold flex items-center space-x-1" title="新規ノートを作成">
                <i class="fa-solid fa-plus"></i>
                <span class="hidden md:inline">新規</span>
            </button>

            <div class="h-6 w-px bg-slate-200 mx-1"></div>

            <div>
                <input type="text" id="noteTitle" value="無題のノート" class="font-bold text-slate-800 text-base bg-transparent border-b border-transparent hover:border-slate-300 focus:border-blue-500 focus:bg-slate-50 focus:outline-none px-1 py-0.5 rounded transition">
                <div class="text-xs text-slate-400 flex items-center space-x-2">
                    <span id="saveStatus"><i class="fa-solid fa-check text-green-500 mr-1"></i>保存済み</span>
                </div>
            </div>
        </div>

        <!-- ページ操作 & ズーム機能 -->
        <div class="flex items-center space-x-2 bg-slate-100 p-1 rounded-xl">
            <button id="prevPageBtn" class="p-2 hover:bg-white rounded-lg text-slate-600 transition disabled:opacity-30 disabled:hover:bg-transparent" title="前のページ">
                <i class="fa-solid fa-chevron-left text-sm"></i>
            </button>
            <span id="pageIndicator" class="text-xs font-semibold text-slate-600 px-2 inline-block max-w-[12rem] truncate">1 / 1</span>
            <button id="nextPageBtn" class="p-2 hover:bg-white rounded-lg text-slate-600 transition disabled:opacity-30 disabled:hover:bg-transparent" title="次のページ">
                <i class="fa-solid fa-chevron-right text-sm"></i>
            </button>
            <button id="addPageBtn" class="p-2 hover:bg-blue-500 hover:text-white rounded-lg text-slate-600 transition" title="新規ページ追加">
                <i class="fa-solid fa-plus text-sm"></i>
            </button>
            <div class="h-5 w-px bg-slate-300/70"></div>
            <button id="chapterToggleBtn" class="p-2 hover:bg-white rounded-lg text-slate-600 transition" title="章アウトライン">
                <i class="fa-solid fa-list-ol text-sm"></i>
                <span class="hidden lg:inline text-xs font-semibold ml-1">章</span>
            </button>
        </div>

        <!-- アクションボタン（Undo/Redo/クリア/保存） -->
        <div class="flex items-center space-x-1 sm:space-x-2">
            <button id="undoBtn" class="p-2.5 text-slate-600 hover:bg-slate-100 rounded-xl transition disabled:opacity-30" title="元に戻す (Ctrl+Z)">
                <i class="fa-solid fa-arrow-rotate-left"></i>
            </button>
            <button id="redoBtn" class="p-2.5 text-slate-600 hover:bg-slate-100 rounded-xl transition disabled:opacity-30" title="やり直す (Ctrl+Y)">
                <i class="fa-solid fa-arrow-rotate-right"></i>
            </button>
            <div class="h-6 w-px bg-slate-200 mx-1"></div>
            <button id="clearBtn" class="p-2.5 text-rose-500 hover:bg-rose-50 rounded-xl transition" title="全消去">
                <i class="fa-solid fa-trash-can"></i>
            </button>
            <button id="uiHideToggleBtn" class="p-2.5 text-slate-600 hover:bg-slate-100 rounded-xl transition flex items-center" title="集中モード: ツールバーを隠す (Ctrl+Shift+H)" aria-pressed="false">
                <i id="uiHideToggleIcon" class="fa-solid fa-eye"></i>
                <span id="uiHideToggleLabel" class="hidden lg:inline ml-1 text-xs font-medium">集中</span>
            </button>
            <button id="themeToggleBtn" class="p-2.5 text-slate-600 hover:bg-slate-100 rounded-xl transition flex items-center" title="ダークモードに切り替え" aria-label="表示モードを切り替え">
                <i id="themeToggleIcon" class="fa-solid fa-moon"></i>
                <span id="themeToggleLabel" class="hidden lg:inline ml-1 text-xs font-medium">ダーク</span>
            </button>
            <button id="headerExportDataBtn" class="p-2.5 text-slate-600 hover:bg-slate-100 rounded-xl transition" title="全ノートのデータをJSONで保存">
                <i class="fa-solid fa-file-export"></i>
                <span class="hidden lg:inline ml-1 text-xs font-medium">データ保存</span>
            </button>
            <label class="p-2.5 text-slate-600 hover:bg-slate-100 rounded-xl transition cursor-pointer" title="保存したJSONデータをインポート">
                <i class="fa-solid fa-file-import"></i>
                <span class="hidden lg:inline ml-1 text-xs font-medium">インポート</span>
                <input type="file" id="headerImportDataInput" accept="application/json,.json" class="hidden">
            </label>
            <button id="downloadBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-xl text-sm font-medium transition shadow-sm flex items-center space-x-1.5">
                <i class="fa-solid fa-download"></i>
                <span class="hidden sm:inline">画像保存</span>
            </button>
        </div>
    </header>

    <!-- メインコンテンツエリア -->
    <div class="flex-1 flex relative overflow-hidden">

        <!-- 左側 floating ツールバー (メインツール) -->
        <div class="theme-panel hideable-panel absolute left-4 top-4 z-10 bg-white/90 backdrop-blur-md p-1.5 rounded-2xl shadow-lg border border-slate-200/80 flex flex-col space-y-1.5">
            <button data-tool="pen" class="tool-btn active p-3 rounded-xl text-slate-600 hover:bg-slate-100 transition relative group" title="ペン (P)">
                <i class="fa-solid fa-pen text-lg block"></i>
                <span class="absolute left-full ml-3 px-2 py-1 bg-slate-800 text-white text-xs rounded opacity-0 group-hover:opacity-100 pointer-events-none transition whitespace-nowrap z-30">ペン</span>
            </button>
            <button data-tool="highlighter" class="tool-btn p-3 rounded-xl text-slate-600 hover:bg-slate-100 transition relative group" title="蛍光ペン (H)">
                <i class="fa-solid fa-highlighter text-lg block"></i>
                <span class="absolute left-full ml-3 px-2 py-1 bg-slate-800 text-white text-xs rounded opacity-0 group-hover:opacity-100 pointer-events-none transition whitespace-nowrap z-30">蛍光ペン</span>
            </button>
            <button data-tool="eraser" class="tool-btn p-3 rounded-xl text-slate-600 hover:bg-slate-100 transition relative group" title="消しゴム (E / 右ドラッグ)">
                <i class="fa-solid fa-eraser text-lg block"></i>
                <span class="absolute left-full ml-3 px-2 py-1 bg-slate-800 text-white text-xs rounded opacity-0 group-hover:opacity-100 pointer-events-none transition whitespace-nowrap z-30">消しゴム（右ドラッグ可）</span>
            </button>
            
            <div class="w-8 h-px bg-slate-200 mx-auto my-1"></div>

            <button data-tool="line" class="tool-btn p-3 rounded-xl text-slate-600 hover:bg-slate-100 transition relative group" title="直線">
                <i class="fa-solid fa-slash text-lg block"></i>
                <span class="absolute left-full ml-3 px-2 py-1 bg-slate-800 text-white text-xs rounded opacity-0 group-hover:opacity-100 pointer-events-none transition whitespace-nowrap z-30">直線</span>
            </button>
            <button data-tool="rect" class="tool-btn p-3 rounded-xl text-slate-600 hover:bg-slate-100 transition relative group" title="長方形">
                <i class="fa-regular fa-square text-lg block"></i>
                <span class="absolute left-full ml-3 px-2 py-1 bg-slate-800 text-white text-xs rounded opacity-0 group-hover:opacity-100 pointer-events-none transition whitespace-nowrap z-30">長方形</span>
            </button>
            <button data-tool="circle" class="tool-btn p-3 rounded-xl text-slate-600 hover:bg-slate-100 transition relative group" title="円">
                <i class="fa-regular fa-circle text-lg block"></i>
                <span class="absolute left-full ml-3 px-2 py-1 bg-slate-800 text-white text-xs rounded opacity-0 group-hover:opacity-100 pointer-events-none transition whitespace-nowrap z-30">円</span>
            </button>
            <button data-tool="text" class="tool-btn p-3 rounded-xl text-slate-600 hover:bg-slate-100 transition relative group" title="テキスト入力：配置場所をクリック (T)">
                <i class="fa-solid fa-font text-lg block"></i>
                <span class="absolute left-full ml-3 px-2 py-1 bg-slate-800 text-white text-xs rounded opacity-0 group-hover:opacity-100 pointer-events-none transition whitespace-nowrap z-30">テキスト</span>
            </button>
            <button data-tool="select" class="tool-btn p-3 rounded-xl text-slate-600 hover:bg-slate-100 transition relative group" title="範囲選択・移動 (S)">
                <i class="fa-solid fa-object-group text-lg block"></i>
                <span class="absolute left-full ml-3 px-2 py-1 bg-slate-800 text-white text-xs rounded opacity-0 group-hover:opacity-100 pointer-events-none transition whitespace-nowrap z-30">範囲選択・移動</span>
            </button>
        </div>

        <!-- 下部 floating プロパティバー (色・線の太さ・背景設定) -->
        <div id="propsBar" class="theme-panel absolute bottom-6 left-1/2 -translate-x-1/2 z-10 bg-white/95 backdrop-blur-md px-5 py-3 rounded-2xl shadow-xl border border-slate-200/80 flex flex-wrap items-center gap-4 max-w-[95vw]">
            
            <!-- カスタムカラーパレット -->
            <div class="flex items-center space-x-2" id="colorPalette">
                <label for="colorChoice" class="text-xs text-slate-400 font-medium shrink-0">描画色:</label>
                <select id="colorChoice" class="text-xs font-medium text-slate-700 bg-white border border-slate-300 rounded-lg px-2 py-1.5 outline-none focus:ring-2 focus:ring-blue-400 cursor-pointer" title="デフォルト色またはカスタム色を選択">
                    <option value="default">デフォルト（自動）</option>
                    <option value="custom">カスタムカラー…</option>
                </select>
                <input type="color" id="customColor" value="#1e293b" class="w-9 h-9 rounded-full cursor-pointer" title="カラーパレットを開く">
                <span id="colorValue" class="text-xs font-mono font-medium text-slate-600 w-[4.5rem]">#1E293B</span>
            </div>

            <div class="h-6 w-px bg-slate-200"></div>

            <!-- 太さ調整 -->
            <div class="flex items-center space-x-2">
                <span class="text-xs text-slate-400 font-medium shrink-0">線:</span>
                <i class="fa-solid fa-circle text-[8px] text-slate-400"></i>
                <input type="range" id="lineWidth" min="1" max="40" value="3" class="w-24 accent-blue-600 cursor-pointer">
                <i class="fa-solid fa-circle text-base text-slate-600"></i>
                <span id="widthValue" class="text-xs font-mono font-medium text-slate-600 w-6 text-right">3px</span>
            </div>

            <div class="h-6 w-px bg-slate-200"></div>

            <!-- 文字専用サイズ -->
            <div class="flex items-center space-x-2">
                <span class="text-xs text-slate-400 font-medium shrink-0">文字:</span>
                <i class="fa-solid fa-font text-xs text-slate-400"></i>
                <input type="range" id="textSize" min="10" max="96" value="24" class="w-24 accent-violet-500 cursor-pointer">
                <i class="fa-solid fa-font text-lg text-slate-600"></i>
                <span id="textSizeValue" class="text-xs font-mono font-medium text-slate-600 w-8 text-right">24px</span>
            </div>

            <div class="h-6 w-px bg-slate-200"></div>

            <!-- 消しゴム専用サイズ -->
            <div class="flex items-center space-x-2">
                <span class="text-xs text-slate-400 font-medium shrink-0">消しゴム:</span>
                <i class="fa-solid fa-circle text-[8px] text-slate-400"></i>
                <input type="range" id="eraserWidth" min="5" max="100" value="24" class="w-24 accent-rose-500 cursor-pointer">
                <i class="fa-solid fa-circle text-base text-slate-600"></i>
                <span id="eraserWidthValue" class="text-xs font-mono font-medium text-slate-600 w-8 text-right">24px</span>
            </div>

            <div class="h-6 w-px bg-slate-200"></div>

            <!-- ノート用紙背景の選択 -->
            <div class="flex items-center space-x-1 overflow-x-auto max-w-[300px] sm:max-w-none py-1">
                <span class="text-xs text-slate-400 font-medium mr-1 shrink-0">背景:</span>
                <button data-bg="grid" class="bg-btn active px-2.5 py-1 text-xs font-medium rounded-lg border border-slate-200 hover:bg-slate-100 transition shrink-0">方眼</button>
                <button data-bg="ruled" class="bg-btn px-2.5 py-1 text-xs font-medium rounded-lg border border-slate-200 hover:bg-slate-100 transition shrink-0">罫線</button>
                <button data-bg="dots" class="bg-btn px-2.5 py-1 text-xs font-medium rounded-lg border border-slate-200 hover:bg-slate-100 transition shrink-0">ドット</button>
                <button data-bg="blank" class="bg-btn px-2.5 py-1 text-xs font-medium rounded-lg border border-slate-200 hover:bg-slate-100 transition shrink-0">白紙</button>
                <button data-bg="dark" class="bg-btn px-2.5 py-1 text-xs font-medium rounded-lg border border-slate-200 hover:bg-slate-100 transition shrink-0">黒板</button>
                <button data-bg="genko" class="bg-btn px-2.5 py-1 text-xs font-medium rounded-lg border border-slate-200 hover:bg-slate-100 transition shrink-0">原稿用紙</button>
                <button data-bg="music" class="bg-btn px-2.5 py-1 text-xs font-medium rounded-lg border border-slate-200 hover:bg-slate-100 transition shrink-0">五線譜</button>
                <button data-bg="english" class="bg-btn px-2.5 py-1 text-xs font-medium rounded-lg border border-slate-200 hover:bg-slate-100 transition shrink-0">英語4線</button>
                <button data-bg="tex" class="bg-btn px-2.5 py-1 text-xs font-medium rounded-lg border border-slate-200 hover:bg-slate-100 transition shrink-0" title="LaTeX論文レイアウト">論文</button>
            </div>
        </div>

        <!-- 描画用キャンバスコンテナ -->
        <div id="canvasContainer" class="w-full h-full relative cursor-pen overflow-hidden">
            <canvas id="backgroundCanvas" class="absolute inset-0 block pointer-events-none" aria-hidden="true"></canvas>
            <canvas id="autoInkCanvas" class="absolute inset-0 block pointer-events-none" aria-hidden="true"></canvas>
            <canvas id="paintCanvas" class="absolute inset-0 block"></canvas>
            <canvas id="textCanvas" class="absolute inset-0 block pointer-events-none" aria-hidden="true"></canvas>
            <div id="selectionOverlay" class="hidden absolute z-20 pointer-events-none" aria-hidden="true"></div>
            
            <!-- インラインテキスト入力用オーバーレイ -->
            <textarea id="canvasTextInput" rows="1" placeholder="文字を入力（Ctrl/⌘ + Enterで確定）" class="hidden absolute z-30 min-w-64 min-h-10 resize-none overflow-hidden bg-white/95 border-2 border-blue-500 rounded-lg outline-none font-sans text-slate-800 px-2 py-1.5 shadow-lg" style="transform: translate(0, 0);"></textarea>

            <!-- 集中モード中のUI復元ボタン -->
            <button id="uiShowBtn" class="theme-panel absolute right-4 bottom-6 z-10 w-11 h-11 rounded-full bg-white/90 backdrop-blur-md shadow-lg border border-slate-200/80 text-slate-500 hover:text-slate-700 transition" title="ツールバーを表示 (Ctrl+Shift+H)" aria-label="ツールバーを表示">
                <i class="fa-solid fa-wand-magic-sparkles text-lg"></i>
            </button>
        </div>
    </div>

    <!-- 章アウトラインパネル（ノート内の章構造） -->
    <div id="chapterPanel" class="theme-panel hidden fixed right-4 top-16 z-40 w-80 bg-white/95 backdrop-blur-md rounded-2xl shadow-xl border border-slate-200/80 overflow-hidden">
        <div class="px-4 py-3 border-b border-slate-100 flex items-center justify-between bg-slate-50">
            <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-list-ol text-blue-600"></i>
                <span>章アウトライン</span>
            </h3>
            <button id="closeChapterPanelBtn" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-lg transition">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div id="chapterListPanel" class="max-h-64 overflow-y-auto p-3 flex flex-col gap-1">
            <!-- JSで動的に描画 -->
        </div>
        <div class="p-3 border-t border-slate-100 bg-slate-50 flex flex-col gap-2">
            <button id="addChapterHereBtn" class="text-left text-xs font-medium text-slate-600 hover:bg-white border border-slate-200 rounded-lg px-3 py-2 transition flex items-center gap-2" title="現在のページを章の先頭にする">
                <i class="fa-solid fa-bookmark"></i>
                <span>このページから章を開始</span>
            </button>
            <button id="addChapterNewPageBtn" class="text-left text-xs font-medium text-slate-600 hover:bg-white border border-slate-200 rounded-lg px-3 py-2 transition flex items-center gap-2" title="末尾に新規ページを追加して章の先頭にする">
                <i class="fa-solid fa-file-circle-plus"></i>
                <span>新しいページで章を開始</span>
            </button>
        </div>
    </div>

    <!-- ノート管理モーダルダイアログ -->
    <div id="notesModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="theme-modal bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[85vh] flex flex-col overflow-hidden">
            <!-- モーダルヘッダー -->
            <div class="theme-subpanel px-6 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-book-open text-blue-600 text-xl"></i>
                    <h2 class="text-lg font-bold text-slate-800">保存したノート一覧</h2>
                </div>
                <button id="closeNotesModalBtn" class="text-slate-400 hover:text-slate-600 p-2 rounded-lg transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- モーダルアクションバー -->
            <div class="px-6 py-3 bg-white border-b border-slate-100 flex justify-between items-center flex-wrap gap-2">
                <div class="flex items-center space-x-2">
                    <button id="modalCreateNoteBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-sm flex items-center space-x-2">
                        <i class="fa-solid fa-plus"></i>
                        <span>新しいノートを作成</span>
                    </button>
                    <button id="modalCreateFolderBtn" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-sm flex items-center space-x-2">
                        <i class="fa-solid fa-folder-plus"></i>
                        <span>新しいフォルダー</span>
                    </button>
                </div>
                <div class="flex items-center space-x-2">
                    <button id="exportNotesBtn" class="text-slate-600 hover:bg-slate-100 px-3 py-1.5 rounded-lg text-xs font-medium border border-slate-200 transition flex items-center space-x-1">
                        <i class="fa-solid fa-file-export"></i>
                        <span>データ保存</span>
                    </button>
                    <label class="text-slate-600 hover:bg-slate-100 px-3 py-1.5 rounded-lg text-xs font-medium border border-slate-200 transition cursor-pointer flex items-center space-x-1">
                        <i class="fa-solid fa-file-import"></i>
                        <span>インポート</span>
                        <input type="file" id="importNotesInput" accept="application/json,.json" class="hidden">
                    </label>
                </div>
            </div>

            <!-- 階層ツリー（論文のアウトライン/PDFサイドバー相当） -->
            <div id="hierarchyTree" class="px-6 py-3 overflow-y-auto flex-1">
                <!-- JSで動的に描画 -->
            </div>
        </div>
    </div>

    <!-- 移動先選択ダイアログ -->
    <div id="moveItemModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[60] items-center justify-center p-4 hidden">
        <div class="theme-modal bg-white rounded-2xl shadow-2xl w-full max-w-sm max-h-[75vh] flex flex-col overflow-hidden">
            <div class="px-5 py-3 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                <h3 class="text-sm font-bold text-slate-800 flex items-center space-x-2">
                    <i class="fa-solid fa-arrow-right-arrow-left text-blue-600"></i>
                    <span>移動先を選択</span>
                </h3>
                <button id="closeMoveDialogBtn" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-lg transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="moveTargetList" class="p-4 overflow-y-auto flex flex-col gap-1.5">
                <!-- JSで動的に描画 -->
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            // --- アプリケーションの状態構造 ---
            const state = {
                currentTool: 'pen',         // pen, highlighter, eraser, line, rect, circle, text
                color: '#1e293b',
                colorIsDefault: true,        // trueならモード・背景に合わせて黒/白を自動選択
                uiMode: 'light',             // light, dark
                uiHidden: false,            // 集中モード: trueならツールUIを隠す
                lineWidth: 3,
                textSize: 24,
                eraserWidth: 24,
                toolBeforeRightErase: null,
                bgType: 'grid',              // grid, ruled, dots, blank, dark, genko, music, english, tex
                pages: [],                   // 各ページのCanvasデータURL配列
                currentPageIndex: 0,
                chapters: [],                // ノート内の章: [{id, title, startPage}]（startPage昇順）
                history: [],                 // Undo/Redoスタック
                historyStep: -1,
                maxHistory: 20,
                isDrawing: false,
                startX: 0,
                startY: 0,
                snapshot: null,              // 図形描画プレビュー用の状態保存
                currentStrokePoints: [],     // 蛍光ペンの重ね塗り防止用の軌跡
                selection: {
                    active: false,
                    mode: null,               // selecting, moving
                    x: 0, y: 0, width: 0, height: 0,
                    originalX: 0, originalY: 0,
                    previewX: 0, previewY: 0,
                    snapshotCustom: null,
                    snapshotAuto: null,
                    cropCustom: null,
                    cropAuto: null,
                    selectedTextIds: [],
                    textOriginalPositions: [],
                    moved: false
                },
                textObjects: [],             // 後から編集できるテキストオブジェクト
                selectedTextId: null,
                
                // ノート管理機能用追加ステート
                currentNoteId: null,
                notesList: [],

                // フォルダー階層（論文/PDFのような構造）用ステート
                folders: [],               // {id, title, parentId, updatedAt}
                modalFolderId: null,       // ノート一覧モーダルで選択中のフォルダー（作成先コンテキスト）
                folderTreeExpanded: null,  // ツリーで展開中のフォルダーIDのSet
                moveContext: null          // 移動ダイアログで移動中の対象 {type:'note'|'folder', id}
            };

            const STORAGE_KEY = 'handwritten_notes_data_v3';
            const LEGACY_STORAGE_KEY = 'handwritten_notes_data_v2';
            const UI_MODE_KEY = 'handwritten_notes_ui_mode';
            const UI_HIDDEN_KEY = 'handwritten_notes_ui_hidden';
            const BACKUP_VERSION = 3;
            const VALID_BACKGROUNDS = new Set(['grid', 'ruled', 'dots', 'blank', 'dark', 'genko', 'music', 'english', 'tex']);

            // DOM要素の参照
            const canvas = document.getElementById('paintCanvas');
            const customCtx = canvas.getContext('2d');
            let ctx = customCtx;
            const autoInkCanvas = document.getElementById('autoInkCanvas');
            const autoInkCtx = autoInkCanvas.getContext('2d');
            const textCanvas = document.getElementById('textCanvas');
            const textCtx = textCanvas.getContext('2d');
            const backgroundCanvas = document.getElementById('backgroundCanvas');
            const bgCtx = backgroundCanvas.getContext('2d');
            const container = document.getElementById('canvasContainer');
            const textInput = document.getElementById('canvasTextInput');
            const selectionOverlay = document.getElementById('selectionOverlay');

            // --- 集中モード（ツールUIの非表示/表示） ---
            function setUiHidden(hidden, persist = true) {
                state.uiHidden = hidden;
                document.body.classList.toggle('ui-hidden', hidden);
                document.getElementById('uiHideToggleIcon').className = `fa-solid ${hidden ? 'fa-eye-slash' : 'fa-eye'}`;
                document.getElementById('uiHideToggleLabel').innerText = hidden ? '表示' : '集中';
                const toggleBtn = document.getElementById('uiHideToggleBtn');
                toggleBtn.title = hidden ? 'ツールバーを表示 (Ctrl+Shift+H)' : '集中モード: ツールバーを隠す (Ctrl+Shift+H)';
                toggleBtn.setAttribute('aria-pressed', String(hidden));
                if (persist) localStorage.setItem(UI_HIDDEN_KEY, String(hidden));
            }

            function getDefaultDrawingColor() {
                // 黒板、またはダークモードの用紙には白。それ以外には黒を使う
                return (state.uiMode === 'dark' || state.bgType === 'dark') ? '#f8fafc' : '#0f172a';
            }

            function updateDrawingColor(color, isDefault = false) {
                state.color = color;
                state.colorIsDefault = isDefault;
                document.getElementById('customColor').value = color;
                document.getElementById('colorValue').innerText = color.toUpperCase();
                document.getElementById('colorChoice').value = isDefault ? 'default' : 'custom';
            }

            function applyUiMode(mode, persist = true) {
                state.uiMode = mode === 'dark' ? 'dark' : 'light';
                document.body.classList.toggle('dark-mode', state.uiMode === 'dark');
                const isDark = state.uiMode === 'dark';
                document.getElementById('themeToggleIcon').className = `fa-solid ${isDark ? 'fa-sun' : 'fa-moon'}`;
                document.getElementById('themeToggleLabel').innerText = isDark ? 'ライト' : 'ダーク';
                document.getElementById('themeToggleBtn').title = `${isDark ? 'ライト' : 'ダーク'}モードに切り替え`;
                document.getElementById('themeToggleBtn').setAttribute('aria-pressed', String(isDark));
                if (state.colorIsDefault) updateDrawingColor(getDefaultDrawingColor(), true);
                renderBackground();
                if (persist) localStorage.setItem(UI_MODE_KEY, state.uiMode);
            }

            // --- LocalStorage ノート保存/読み込みロジック ---
            // v3形式（フォルダー階層対応）。旧v2形式（ノート配列のみ）からも移行する
            function sanitizeFolderRefs(purgeCycles) {
                const folderIds = new Set(state.folders.map(f => f.id));
                state.folders.forEach(folder => {
                    if (typeof folder.parentId !== 'string' || !folderIds.has(folder.parentId)) {
                        folder.parentId = null;
                    }
                });
                state.notesList.forEach(note => {
                    if (typeof note.parentId !== 'string' || !folderIds.has(note.parentId)) {
                        note.parentId = null;
                    }
                });
                if (purgeCycles) {
                    state.folders.forEach(folder => {
                        const seen = new Set();
                        let cursor = folder.parentId;
                        while (cursor) {
                            if (seen.has(cursor)) { folder.parentId = null; break; }
                            seen.add(cursor);
                            cursor = (state.folders.find(f => f.id === cursor) || {}).parentId || null;
                        }
                    });
                }
            }

            function loadAllNotesFromStorage() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        state.notesList = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.notes) ? parsed.notes : []);
                        state.folders = parsed && !Array.isArray(parsed) && Array.isArray(parsed.folders) ? parsed.folders : [];
                    } else {
                        // 旧キー（v2: ノート配列のみ）からの移行
                        const legacyRaw = localStorage.getItem(LEGACY_STORAGE_KEY);
                        if (legacyRaw) {
                            const legacy = JSON.parse(legacyRaw);
                            state.notesList = Array.isArray(legacy) ? legacy : [];
                            state.folders = [];
                        }
                    }
                } catch(e) {
                    console.error("ノートデータの読み込み失敗:", e);
                    state.notesList = [];
                    state.folders = [];
                }

                if (!Array.isArray(state.notesList)) state.notesList = [];
                if (!Array.isArray(state.folders)) state.folders = [];
                state.folders = state.folders.filter(f => f && typeof f === 'object' && typeof f.id === 'string' && f.id);
                sanitizeFolderRefs(true);

                if (state.notesList.length === 0) {
                    // 初期デフォルトノート作成
                    const defaultNote = {
                        id: 'note_' + Date.now(),
                        title: '無題のノート',
                        bgType: 'grid',
                        pages: [null],
                        currentPageIndex: 0,
                        chapters: [],
                        parentId: null,
                        updatedAt: Date.now()
                    };
                    state.notesList = [defaultNote];
                    saveAllNotesToStorage();
                }

                // 最新のノートを開く
                const lastNote = state.notesList[0];
                loadNoteById(lastNote.id);
            }

            function saveAllNotesToStorage() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({
                        version: BACKUP_VERSION,
                        folders: state.folders,
                        notes: state.notesList
                    }));
                    const statusEl = document.getElementById('saveStatus');
                    statusEl.innerHTML = '<i class="fa-solid fa-check text-green-500 mr-1"></i>自動保存済み';
                } catch(e) {
                    console.error("保存容量上限エラー:", e);
                    const statusEl = document.getElementById('saveStatus');
                    statusEl.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-amber-500 mr-1"></i>容量超過注意';
                }
            }

            function syncCurrentNoteToMemory() {
                if (!state.currentNoteId) return;
                
                // 現在のキャンバス描画を現在のページ配列に反映
                saveCurrentPageData();

                const index = state.notesList.findIndex(n => n.id === state.currentNoteId);
                if (index !== -1) {
                    state.notesList[index].title = document.getElementById('noteTitle').value || '無題のノート';
                    state.notesList[index].bgType = state.bgType;
                    state.notesList[index].pages = state.pages;
                    state.notesList[index].currentPageIndex = state.currentPageIndex;
                    state.notesList[index].chapters = state.chapters;
                    state.notesList[index].updatedAt = Date.now();

                    // 先頭（最新更新）に並び替え
                    const updatedNote = state.notesList.splice(index, 1)[0];
                    state.notesList.unshift(updatedNote);

                    saveAllNotesToStorage();
                }
            }

            function loadNoteById(noteId) {
                const note = state.notesList.find(n => n.id === noteId);
                if (!note) return;

                state.currentNoteId = note.id;
                document.getElementById('noteTitle').value = note.title;
                state.bgType = note.bgType || 'grid';
                state.pages = note.pages && note.pages.length > 0 ? note.pages : [null];
                state.currentPageIndex = note.currentPageIndex || 0;
                state.chapters = getValidatedChapters(note, state.pages);
                if (state.colorIsDefault) updateDrawingColor(getDefaultDrawingColor(), true);

                // 背景UIボタンのアクティブ更新
                document.querySelectorAll('.bg-btn').forEach(btn => {
                    const isActive = btn.dataset.bg === state.bgType;
                    btn.classList.toggle('active', isActive);
                    btn.setAttribute('aria-pressed', String(isActive));
                });

                // 該当ページ読み込み
                loadPageData(state.currentPageIndex);
            }

            function createNewNote(title = '無題のノート', bgType = 'grid', parentId = null) {
                syncCurrentNoteToMemory();

                const newNote = {
                    id: 'note_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                    title: title,
                    bgType: bgType,
                    pages: [null],
                    currentPageIndex: 0,
                    chapters: [],
                    parentId: parentId,
                    updatedAt: Date.now()
                };

                state.notesList.unshift(newNote);
                saveAllNotesToStorage();
                loadNoteById(newNote.id);
            }

            function deleteNote(noteId) {
                if (state.notesList.length <= 1) {
                    alert('最後のノートは削除できません。新規ノートを作成してから削除してください。');
                    return;
                }

                if (!confirm('このノートを削除してもよろしいですか？')) return;

                state.notesList = state.notesList.filter(n => n.id !== noteId);
                saveAllNotesToStorage();

                if (state.currentNoteId === noteId) {
                    loadNoteById(state.notesList[0].id);
                }
                renderHierarchyTree();
            }

            // --- フォルダー階層（ノートの整理） ---
            function getFolderById(folderId) {
                return state.folders.find(f => f.id === folderId) || null;
            }

            function getChildFolders(parentId) {
                const targetId = parentId || null;
                return state.folders
                    .filter(f => (f.parentId || null) === targetId)
                    .sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
            }

            function getNotesInFolder(parentId) {
                const targetId = parentId || null;
                // notesListは更新日時の新しい順に保たれているため、絞り込むだけで良い
                return state.notesList.filter(n => (n.parentId || null) === targetId);
            }

            function getFolderAncestry(folderId) {
                // ルートから該当フォルダーまでの先祖列。循環参照があれば中断
                const chain = [];
                const seen = new Set();
                let cursor = folderId;
                while (cursor) {
                    if (seen.has(cursor)) break;
                    seen.add(cursor);
                    const folder = getFolderById(cursor);
                    if (!folder) break;
                    chain.unshift(folder);
                    cursor = folder.parentId || null;
                }
                return chain;
            }

            function isFolderDescendant(candidateId, ancestorId) {
                let cursor = candidateId;
                const seen = new Set();
                while (cursor) {
                    if (cursor === ancestorId) return true;
                    if (seen.has(cursor)) break;
                    seen.add(cursor);
                    cursor = (getFolderById(cursor) || {}).parentId || null;
                }
                return false;
            }

            function countFolderContents(folderId) {
                // 直下のノート/フォルダー件数
                return {
                    notes: getNotesInFolder(folderId).length,
                    folders: getChildFolders(folderId).length
                };
            }

            function createFolder(title, parentId) {
                const folder = {
                    id: 'folder_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                    title: title || '新しいフォルダー',
                    parentId: parentId || null,
                    updatedAt: Date.now()
                };
                state.folders.push(folder);
                saveAllNotesToStorage();
                return folder;
            }

            function renameFolder(folderId, newTitle) {
                const folder = getFolderById(folderId);
                if (!folder || !newTitle) return;
                folder.title = newTitle;
                saveAllNotesToStorage();
            }

            function deleteFolder(folderId) {
                const folder = getFolderById(folderId);
                if (!folder) return;

                const { notes, folders } = countFolderContents(folderId);
                const message = `フォルダー「${folder.title}」を削除します。\n中のノート${notes}件・フォルダー${folders}件は1つ上の階層へ移動します。`;
                if (!confirm(message)) return;

                // 中身は消さずに上位フォルダーへ移動（データ保護）
                const parentId = folder.parentId || null;
                state.notesList.forEach(note => {
                    if ((note.parentId || null) === folderId) note.parentId = parentId;
                });
                state.folders.forEach(child => {
                    if ((child.parentId || null) === folderId) child.parentId = parentId;
                });
                state.folders = state.folders.filter(f => f.id !== folderId);
                if ((state.modalFolderId || null) === folderId) state.modalFolderId = parentId;
                if (state.moveContext && state.moveContext.id === folderId) closeMoveDialog();

                saveAllNotesToStorage();
                renderHierarchyTree();
            }

            function moveNoteToFolder(noteId, targetFolderId) {
                const note = state.notesList.find(n => n.id === noteId);
                if (!note) return;
                note.parentId = targetFolderId || null;
                saveAllNotesToStorage();
            }

            function moveFolderToFolder(folderId, targetFolderId) {
                if (folderId === targetFolderId) return;
                const folder = getFolderById(folderId);
                if (!folder) return;
                // 自分自身の子孫への移動は循環になるため不可
                if (targetFolderId && isFolderDescendant(targetFolderId, folderId)) {
                    alert('自分自身の中にあるフォルダーへは移動できません。');
                    return;
                }
                folder.parentId = targetFolderId || null;
                folder.updatedAt = Date.now();
                if ((state.modalFolderId || null) === folderId) state.modalFolderId = targetFolderId || null;
                saveAllNotesToStorage();
            }

            // --- ノート内の章構造（論文の章・節構成） ---
            // 章 = 開始ページが決まっている目印。ページ実体は変わらないため削除しても安全
            function getValidatedChapters(note, pages) {
                if (!Array.isArray(note.chapters)) return [];
                const maxPage = pages.length - 1;
                const seenStarts = new Set();
                return note.chapters
                    .filter(c => c && typeof c === 'object' && Number.isInteger(c.startPage) && c.startPage >= 0)
                    .sort((a, b) => a.startPage - b.startPage)
                    .filter(c => {
                        if (c.startPage > maxPage || seenStarts.has(c.startPage)) return false;
                        seenStarts.add(c.startPage);
                        return true;
                    })
                    .map((c, i) => ({
                        id: typeof c.id === 'string' && c.id ? c.id : `chapter_${Date.now()}_${i}`,
                        title: typeof c.title === 'string' && c.title.trim() ? c.title : `第${i + 1}章`,
                        startPage: c.startPage
                    }));
            }

            function sortChapters() {
                state.chapters.sort((a, b) => a.startPage - b.startPage);
            }

            function getChapterAt(pageIndex) {
                let current = null;
                for (const chapter of state.chapters) {
                    if (chapter.startPage <= pageIndex) current = chapter;
                    else break;
                }
                return current;
            }

            function startChapterAt(pageIndex, title) {
                if (state.chapters.some(c => c.startPage === pageIndex)) {
                    alert('このページは既に章の先頭です。章名を変更する場合はアウトラインから編集してください。');
                    return null;
                }
                const chapter = {
                    id: 'chapter_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
                    title: (title && title.trim()) || `第${state.chapters.length + 1}章`,
                    startPage: pageIndex
                };
                state.chapters.push(chapter);
                sortChapters();
                syncCurrentNoteToMemory();
                renderChapterPanel();
                updatePageUI();
                return chapter;
            }

            function renameChapter(chapterId, newTitle) {
                const chapter = state.chapters.find(c => c.id === chapterId);
                if (!chapter || !newTitle || !newTitle.trim()) return;
                chapter.title = newTitle.trim();
                syncCurrentNoteToMemory();
                renderChapterPanel();
                updatePageUI();
            }

            function deleteChapter(chapterId) {
                // ページは消えず、前の章の範囲へ戻るだけ
                state.chapters = state.chapters.filter(c => c.id !== chapterId);
                syncCurrentNoteToMemory();
                renderChapterPanel();
                updatePageUI();
            }

            function renderChapterPanel() {
                const listEl = document.getElementById('chapterListPanel');
                listEl.innerHTML = '';
                sortChapters();

                if (state.chapters.length === 0) {
                    const emptyEl = document.createElement('p');
                    emptyEl.className = 'text-center text-xs text-slate-400 py-6';
                    emptyEl.innerText = '章はまだありません';
                    listEl.appendChild(emptyEl);
                    return;
                }

                const currentChapter = getChapterAt(state.currentPageIndex);
                state.chapters.forEach((chapter, index) => {
                    const nextChapter = state.chapters[index + 1];
                    const lastPage = nextChapter ? nextChapter.startPage - 1 : state.pages.length - 1;
                    const isCurrent = currentChapter && currentChapter.id === chapter.id;

                    const row = document.createElement('div');
                    row.className = `group flex items-center gap-2 px-3 py-2 rounded-xl cursor-pointer transition ${isCurrent ? 'bg-blue-50 ring-1 ring-blue-400' : 'hover:bg-slate-100'}`;
                    row.innerHTML = `
                        <span class="text-[10px] font-mono text-slate-400 shrink-0">${index + 1}.</span>
                        <span class="text-sm text-slate-700 truncate flex-1 font-medium">${chapter.title}</span>
                        <span class="text-[10px] text-slate-400 shrink-0">p.${chapter.startPage + 1}${lastPage > chapter.startPage ? `-${lastPage + 1}` : ''}</span>
                        <div class="hidden group-hover:flex items-center gap-0.5 shrink-0">
                            <button class="rename-chapter-btn text-slate-400 hover:text-blue-600 p-1.5 rounded-lg hover:bg-blue-50 transition" title="章名を変更">
                                <i class="fa-solid fa-pen text-xs"></i>
                            </button>
                            <button class="delete-chapter-btn text-rose-400 hover:text-rose-600 p-1.5 rounded-lg hover:bg-rose-50 transition" title="章を削除（ページは残ります）">
                                <i class="fa-regular fa-trash-can text-xs"></i>
                            </button>
                        </div>
                    `;
                    row.addEventListener('click', (e) => {
                        if (e.target.closest('button')) return;
                        saveCurrentPageData();
                        loadPageData(chapter.startPage);
                    });
                    row.querySelector('.rename-chapter-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        const newTitle = prompt('章名を入力', chapter.title);
                        if (newTitle) renameChapter(chapter.id, newTitle);
                    });
                    row.querySelector('.delete-chapter-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteChapter(chapter.id);
                    });
                    listEl.appendChild(row);
                });
            }

            function openChapterPanel() {
                renderChapterPanel();
                document.getElementById('chapterPanel').classList.remove('hidden');
            }

            function closeChapterPanel() {
                document.getElementById('chapterPanel').classList.add('hidden');
            }

            // --- キャンバスサイズの最適化 ---
            function resizeCanvas() {
                clearSelection();
                // カスタム色と自動色の筆跡レイヤーをそれぞれ退避
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                const tempCtx = tempCanvas.getContext('2d');
                const tempAutoCanvas = document.createElement('canvas');
                tempAutoCanvas.width = autoInkCanvas.width;
                tempAutoCanvas.height = autoInkCanvas.height;
                const tempAutoCtx = tempAutoCanvas.getContext('2d');
                if (canvas.width > 0 && canvas.height > 0) {
                    tempCtx.drawImage(canvas, 0, 0);
                    tempAutoCtx.drawImage(autoInkCanvas, 0, 0);
                }

                // コンテナの実際のピクセルサイズに合わせる
                canvas.width = container.clientWidth;
                canvas.height = container.clientHeight;
                autoInkCanvas.width = container.clientWidth;
                autoInkCanvas.height = container.clientHeight;
                textCanvas.width = container.clientWidth;
                textCanvas.height = container.clientHeight;
                backgroundCanvas.width = container.clientWidth;
                backgroundCanvas.height = container.clientHeight;

                // 背景再描画 & 透明な描画データ復元
                renderBackground();
                if (tempCanvas.width > 0 && tempCanvas.height > 0) {
                    customCtx.drawImage(tempCanvas, 0, 0);
                    autoInkCtx.drawImage(tempAutoCanvas, 0, 0);
                }
                renderTextObjects();
            }

            // --- 背景パターン描画 ---
            function renderBackgroundTo(targetCtx, w, h, bgType = state.bgType, uiMode = state.uiMode) {
                const isDarkPaper = uiMode === 'dark' || bgType === 'dark';
                const subtleLine = isDarkPaper ? '#334155' : '#e2e8f0';
                const mediumLine = isDarkPaper ? '#64748b' : '#94a3b8';

                // ベースクリア
                targetCtx.clearRect(0, 0, w, h);
                if (isDarkPaper) {
                    targetCtx.fillStyle = '#1e293b'; // ダーク黒板色
                    targetCtx.fillRect(0, 0, w, h);
                } else {
                    targetCtx.fillStyle = '#ffffff'; // ホワイトノート
                    targetCtx.fillRect(0, 0, w, h);
                }

                targetCtx.save();
                targetCtx.lineWidth = 1;

                if (bgType === 'grid') {
                    // 方眼紙
                    targetCtx.strokeStyle = subtleLine;
                    const gridSize = 25;
                    for (let x = gridSize; x < w; x += gridSize) {
                        targetCtx.beginPath();
                        targetCtx.moveTo(x, 0);
                        targetCtx.lineTo(x, h);
                        targetCtx.stroke();
                    }
                    for (let y = gridSize; y < h; y += gridSize) {
                        targetCtx.beginPath();
                        targetCtx.moveTo(0, y);
                        targetCtx.lineTo(w, y);
                        targetCtx.stroke();
                    }
                } else if (bgType === 'ruled') {
                    // 罫線
                    targetCtx.strokeStyle = isDarkPaper ? '#475569' : '#cbd5e1';
                    const lineHeight = 32;
                    for (let y = lineHeight + 20; y < h; y += lineHeight) {
                        targetCtx.beginPath();
                        targetCtx.moveTo(40, y);
                        targetCtx.lineTo(w - 40, y);
                        targetCtx.stroke();
                    }
                    // 左側の赤いマージン線
                    targetCtx.strokeStyle = isDarkPaper ? '#ef4444' : '#fca5a5';
                    targetCtx.beginPath();
                    targetCtx.moveTo(70, 0);
                    targetCtx.lineTo(70, h);
                    targetCtx.stroke();
                } else if (bgType === 'dots') {
                    // ドット方眼
                    targetCtx.fillStyle = mediumLine;
                    const dotSpacing = 24;
                    for (let x = dotSpacing; x < w; x += dotSpacing) {
                        for (let y = dotSpacing; y < h; y += dotSpacing) {
                            targetCtx.beginPath();
                            targetCtx.arc(x, y, 1.2, 0, Math.PI * 2);
                            targetCtx.fill();
                        }
                    }
                } else if (bgType === 'genko') {
                    // 原稿用紙風格子
                    targetCtx.strokeStyle = isDarkPaper ? '#475569' : '#cbd5e1';
                    const boxSize = 28;
                    const gap = 6;
                    const cols = Math.floor((w - 60) / (boxSize + gap));
                    const rows = Math.floor((h - 60) / boxSize);
                    
                    for (let r = 0; r < rows; r++) {
                        for (let c = 0; c < cols; c++) {
                            const x = 30 + c * (boxSize + gap);
                            const y = 30 + r * boxSize;
                            targetCtx.strokeRect(x, y, boxSize, boxSize);
                        }
                    }
                } else if (bgType === 'music') {
                    // 五線譜
                    targetCtx.strokeStyle = mediumLine;
                    const lineGap = 10;
                    const staffGap = 50;
                    let currentY = 50;

                    while (currentY + lineGap * 4 < h - 40) {
                        for (let i = 0; i < 5; i++) {
                            targetCtx.beginPath();
                            targetCtx.moveTo(30, currentY + i * lineGap);
                            targetCtx.lineTo(w - 30, currentY + i * lineGap);
                            targetCtx.stroke();
                        }
                        currentY += lineGap * 4 + staffGap;
                    }
                } else if (bgType === 'english') {
                    // 英語4線ノート
                    const lineGap = 12;
                    const groupGap = 40;
                    let currentY = 50;

                    while (currentY + lineGap * 3 < h - 40) {
                        // 1本目 & 4本目: 青線, 2,3本目: 赤破線/実線
                        for (let i = 0; i < 4; i++) {
                            targetCtx.beginPath();
                            if (i === 1 || i === 2) {
                                targetCtx.strokeStyle = '#f87171';
                            } else {
                                targetCtx.strokeStyle = '#60a5fa';
                            }
                            targetCtx.moveTo(30, currentY + i * lineGap);
                            targetCtx.lineTo(w - 30, currentY + i * lineGap);
                            targetCtx.stroke();
                        }
                        currentY += lineGap * 3 + groupGap;
                    }
                } else if (bgType === 'tex') {
                    // LaTeX (article) 風論文レイアウト: 余白・タイトル部・著者行・要旨・節見出しガイド
                    const marginX = Math.max(48, Math.floor(w * 0.12));

                    // タイトル下の二重罫線 (\title)
                    const titleRuleY = 96;
                    targetCtx.strokeStyle = mediumLine;
                    targetCtx.beginPath();
                    targetCtx.moveTo(marginX, titleRuleY);
                    targetCtx.lineTo(w - marginX, titleRuleY);
                    targetCtx.moveTo(marginX, titleRuleY + 7);
                    targetCtx.lineTo(w - marginX, titleRuleY + 7);
                    targetCtx.stroke();

                    // 著者・所属・日付の行ガイド (\author, \date)
                    targetCtx.strokeStyle = subtleLine;
                    const authorY = titleRuleY + 34;
                    targetCtx.beginPath();
                    targetCtx.moveTo(w / 2 - 110, authorY);
                    targetCtx.lineTo(w / 2 + 110, authorY);
                    targetCtx.moveTo(w / 2 - 70, authorY + 24);
                    targetCtx.lineTo(w / 2 + 70, authorY + 24);
                    targetCtx.stroke();

                    // 要旨ブロック (abstract環境): 左右インデンツ付きの上下罫
                    const abstractTop = authorY + 56;
                    const abstractBottom = abstractTop + 80;
                    targetCtx.strokeStyle = subtleLine;
                    targetCtx.beginPath();
                    targetCtx.moveTo(marginX + 64, abstractTop);
                    targetCtx.lineTo(w - marginX - 64, abstractTop);
                    targetCtx.moveTo(marginX + 64, abstractBottom);
                    targetCtx.lineTo(w - marginX - 64, abstractBottom);
                    targetCtx.stroke();
                    targetCtx.fillStyle = mediumLine;
                    targetCtx.font = "13px 'STIX Two Text', 'Times New Roman', serif";
                    targetCtx.textAlign = 'center';
                    targetCtx.fillText('Abstract', w / 2, abstractTop - 8);
                    targetCtx.textAlign = 'left';

                    // 本文の罫線ガイド
                    const bodyLineGap = 30;
                    for (let y = abstractBottom + 34; y < h - 36; y += bodyLineGap) {
                        targetCtx.beginPath();
                        targetCtx.moveTo(marginX, y);
                        targetCtx.lineTo(w - marginX, y);
                        targetCtx.stroke();
                    }

                    // 節見出しガイド (\section): 番号欄 + 見出し罫
                    for (let y = abstractBottom + 34 + bodyLineGap * 3; y < h - 72; y += bodyLineGap * 8) {
                        targetCtx.strokeStyle = mediumLine;
                        targetCtx.beginPath();
                        targetCtx.moveTo(marginX, y - 6);
                        targetCtx.lineTo(marginX + 34, y - 6);
                        targetCtx.stroke();
                        targetCtx.strokeStyle = subtleLine;
                        const sectionIndex = Math.floor((y - abstractBottom - 34 - bodyLineGap * 3) / (bodyLineGap * 8)) + 1;
                        targetCtx.fillStyle = mediumLine;
                        targetCtx.font = "italic 12px 'STIX Two Text', 'Times New Roman', serif";
                        targetCtx.fillText(String(sectionIndex), marginX + 40, y - 2);
                    }
                }

                targetCtx.restore();
            }

            function renderBackground() {
                renderBackgroundTo(bgCtx, backgroundCanvas.width, backgroundCanvas.height);
                document.body.classList.toggle('canvas-dark-paper', state.uiMode !== 'dark' && state.bgType === 'dark');
                renderTextObjects();
            }

            // --- 編集可能テキストオブジェクト ---
            // 論文(TeX)背景ではセリフ体(STIX)を、それ以外はInterを使う
            function getTextFontStack() {
                return state.bgType === 'tex'
                    ? "'STIX Two Text', 'Times New Roman', serif"
                    : "'Inter', sans-serif";
            }

            function getTextObjectColor(textObject) {
                if (!textObject.colorIsDefault) return textObject.color;
                return (state.uiMode === 'dark' || state.bgType === 'dark') ? '#f8fafc' : '#0f172a';
            }

            function getTextBounds(textObject) {
                const size = textObject.size || 24;
                const lineHeight = size * 1.25;
                const lines = String(textObject.text || '').split('\n');
                textCtx.save();
                textCtx.font = `${size}px ${getTextFontStack()}`;
                const width = Math.max(1, ...lines.map(line => textCtx.measureText(line || ' ').width));
                textCtx.restore();
                return {
                    x: textObject.x,
                    y: textObject.y,
                    width,
                    height: Math.max(lineHeight, lines.length * lineHeight)
                };
            }

            function renderTextObjects() {
                if (!textCanvas.width || !textCanvas.height) return;
                textCtx.clearRect(0, 0, textCanvas.width, textCanvas.height);
                state.textObjects.forEach(textObject => {
                    const size = textObject.size || 24;
                    const lineHeight = size * 1.25;
                    textCtx.save();
                    textCtx.globalAlpha = 1;
                    textCtx.font = `${size}px ${getTextFontStack()}`;
                    textCtx.textBaseline = 'top';
                    textCtx.fillStyle = getTextObjectColor(textObject);
                    String(textObject.text || '').split('\n').forEach((line, index) => {
                        textCtx.fillText(line, textObject.x, textObject.y + index * lineHeight);
                    });
                    textCtx.restore();
                });
            }

            function findTextObjectAt(pos) {
                for (let i = state.textObjects.length - 1; i >= 0; i--) {
                    const bounds = getTextBounds(state.textObjects[i]);
                    if (pos.x >= bounds.x && pos.x <= bounds.x + bounds.width &&
                        pos.y >= bounds.y && pos.y <= bounds.y + bounds.height) {
                        return state.textObjects[i];
                    }
                }
                return null;
            }

            function eraseTextObjectsAt(pos) {
                const radius = state.eraserWidth / 2;
                const previousLength = state.textObjects.length;
                state.textObjects = state.textObjects.filter(textObject => {
                    const bounds = getTextBounds(textObject);
                    const closestX = Math.max(bounds.x, Math.min(pos.x, bounds.x + bounds.width));
                    const closestY = Math.max(bounds.y, Math.min(pos.y, bounds.y + bounds.height));
                    return Math.hypot(pos.x - closestX, pos.y - closestY) > radius;
                });
                if (state.textObjects.length !== previousLength) {
                    state.selectedTextId = null;
                    renderTextObjects();
                }
            }

            function showSelectedTextOutline(textObject) {
                if (!textObject) {
                    selectionOverlay.classList.add('hidden');
                    return;
                }
                const bounds = getTextBounds(textObject);
                updateSelectionOverlay(bounds.x - 3, bounds.y - 3, bounds.width + 6, bounds.height + 6);
            }

            // --- 座標取得 helper ---
            function getPointerPos(e) {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            }

            // --- 矩形範囲の選択・移動 ---
            function updateSelectionOverlay(x, y, width, height, moving = false) {
                selectionOverlay.style.left = `${x}px`;
                selectionOverlay.style.top = `${y}px`;
                selectionOverlay.style.width = `${width}px`;
                selectionOverlay.style.height = `${height}px`;
                selectionOverlay.classList.remove('hidden');
                selectionOverlay.classList.toggle('moving', moving);
            }

            function clearSelection() {
                state.selection.active = false;
                state.selection.mode = null;
                state.selection.cropCustom = null;
                state.selection.cropAuto = null;
                selectionOverlay.classList.add('hidden');
                selectionOverlay.classList.remove('moving');
            }

            function isInsideSelection(pos) {
                const s = state.selection;
                return s.active && pos.x >= s.x && pos.x <= s.x + s.width &&
                    pos.y >= s.y && pos.y <= s.y + s.height;
            }

            function createSelectionCrop(sourceCanvas, x, y, width, height) {
                const crop = document.createElement('canvas');
                crop.width = width;
                crop.height = height;
                crop.getContext('2d').drawImage(sourceCanvas, x, y, width, height, 0, 0, width, height);
                return crop;
            }

            function startSelection(pos) {
                const s = state.selection;
                state.selectedTextId = null;
                state.isDrawing = true;
                s.moved = false;

                if (isInsideSelection(pos)) {
                    s.mode = 'moving';
                    s.originalX = s.x;
                    s.originalY = s.y;
                    s.previewX = s.x;
                    s.previewY = s.y;
                    state.startX = pos.x;
                    state.startY = pos.y;
                    s.snapshotCustom = customCtx.getImageData(0, 0, canvas.width, canvas.height);
                    s.snapshotAuto = autoInkCtx.getImageData(0, 0, autoInkCanvas.width, autoInkCanvas.height);
                    s.cropCustom = createSelectionCrop(canvas, s.x, s.y, s.width, s.height);
                    s.cropAuto = createSelectionCrop(autoInkCanvas, s.x, s.y, s.width, s.height);
                    s.selectedTextIds = state.textObjects.filter(textObject => {
                        const bounds = getTextBounds(textObject);
                        const centerX = bounds.x + bounds.width / 2;
                        const centerY = bounds.y + bounds.height / 2;
                        return centerX >= s.x && centerX <= s.x + s.width &&
                            centerY >= s.y && centerY <= s.y + s.height;
                    }).map(textObject => textObject.id);
                    s.textOriginalPositions = state.textObjects
                        .filter(textObject => s.selectedTextIds.includes(textObject.id))
                        .map(textObject => ({ id: textObject.id, x: textObject.x, y: textObject.y }));
                    updateSelectionOverlay(s.x, s.y, s.width, s.height, true);
                } else {
                    clearSelection();
                    s.mode = 'selecting';
                    state.startX = pos.x;
                    state.startY = pos.y;
                    s.x = pos.x;
                    s.y = pos.y;
                    s.width = 0;
                    s.height = 0;
                    updateSelectionOverlay(pos.x, pos.y, 0, 0);
                }
            }

            function updateSelection(pos) {
                const s = state.selection;
                if (s.mode === 'selecting') {
                    s.x = Math.max(0, Math.min(state.startX, pos.x));
                    s.y = Math.max(0, Math.min(state.startY, pos.y));
                    s.width = Math.min(canvas.width, Math.max(state.startX, pos.x)) - s.x;
                    s.height = Math.min(canvas.height, Math.max(state.startY, pos.y)) - s.y;
                    updateSelectionOverlay(s.x, s.y, s.width, s.height);
                } else if (s.mode === 'moving') {
                    const maxX = Math.max(0, canvas.width - s.width);
                    const maxY = Math.max(0, canvas.height - s.height);
                    s.previewX = Math.round(Math.max(0, Math.min(maxX, s.originalX + pos.x - state.startX)));
                    s.previewY = Math.round(Math.max(0, Math.min(maxY, s.originalY + pos.y - state.startY)));
                    s.moved = s.previewX !== s.originalX || s.previewY !== s.originalY;

                    customCtx.putImageData(s.snapshotCustom, 0, 0);
                    autoInkCtx.putImageData(s.snapshotAuto, 0, 0);
                    customCtx.clearRect(s.originalX, s.originalY, s.width, s.height);
                    autoInkCtx.clearRect(s.originalX, s.originalY, s.width, s.height);
                    customCtx.drawImage(s.cropCustom, s.previewX, s.previewY);
                    autoInkCtx.drawImage(s.cropAuto, s.previewX, s.previewY);
                    const deltaX = s.previewX - s.originalX;
                    const deltaY = s.previewY - s.originalY;
                    s.textOriginalPositions.forEach(original => {
                        const textObject = state.textObjects.find(item => item.id === original.id);
                        if (textObject) {
                            textObject.x = original.x + deltaX;
                            textObject.y = original.y + deltaY;
                        }
                    });
                    renderTextObjects();
                    updateSelectionOverlay(s.previewX, s.previewY, s.width, s.height, true);
                }
            }

            function finishSelection() {
                const s = state.selection;
                state.isDrawing = false;
                if (s.mode === 'selecting') {
                    s.x = Math.round(s.x);
                    s.y = Math.round(s.y);
                    s.width = Math.round(s.width);
                    s.height = Math.round(s.height);
                    if (s.width >= 4 && s.height >= 4) {
                        s.active = true;
                        updateSelectionOverlay(s.x, s.y, s.width, s.height);
                    } else {
                        clearSelection();
                    }
                } else if (s.mode === 'moving') {
                    s.x = s.previewX;
                    s.y = s.previewY;
                    s.active = true;
                    updateSelectionOverlay(s.x, s.y, s.width, s.height);
                    if (s.moved) {
                        saveHistory();
                        syncCurrentNoteToMemory();
                    }
                }
                s.mode = null;
                s.snapshotCustom = null;
                s.snapshotAuto = null;
                s.cropCustom = null;
                s.cropAuto = null;
                s.selectedTextIds = [];
                s.textOriginalPositions = [];
                selectionOverlay.classList.remove('moving');
            }

            // --- 描画ロジック ---
            function startDrawing(e) {
                if (e.type === 'mousedown' && e.button !== 0 && e.button !== 2) return;
                if (e.type === 'touchstart') {
                    e.preventDefault();
                }

                // 既定色の内容はモード連動レイヤー、カスタム色は固定色レイヤーへ描く
                ctx = state.colorIsDefault ? autoInkCtx : customCtx;

                if (state.currentTool === 'text') {
                    if (e.cancelable) e.preventDefault();
                    handleTextPlacement(e);
                    return;
                }

                if (state.currentTool === 'select') {
                    startSelection(getPointerPos(e));
                    return;
                }

                state.isDrawing = true;
                const pos = getPointerPos(e);
                state.startX = pos.x;
                state.startY = pos.y;
                state.currentStrokePoints = [pos];

                state.snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);

                applyToolStyle(ctx);

                if (state.currentTool === 'eraser') {
                    eraseTextObjectsAt(pos);
                    [customCtx, autoInkCtx].forEach(targetCtx => {
                        applyToolStyle(targetCtx);
                        targetCtx.beginPath();
                        targetCtx.arc(pos.x, pos.y, Math.max(1, targetCtx.lineWidth / 2), 0, Math.PI * 2);
                        targetCtx.fill();
                        targetCtx.beginPath();
                        targetCtx.moveTo(pos.x, pos.y);
                    });
                } else if (['pen', 'highlighter'].includes(state.currentTool)) {
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, Math.max(1, ctx.lineWidth / 2), 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.beginPath();
                    ctx.moveTo(pos.x, pos.y);
                }
            }

            function applyToolStyle(targetCtx = ctx) {
                const drawingColor = state.colorIsDefault ? '#000000' : state.color;
                targetCtx.strokeStyle = drawingColor;
                targetCtx.fillStyle = drawingColor;
                targetCtx.lineWidth = state.lineWidth;
                targetCtx.lineCap = 'round';
                targetCtx.lineJoin = 'round';
                targetCtx.globalAlpha = 1.0;
                targetCtx.globalCompositeOperation = 'source-over';

                if (state.currentTool === 'highlighter') {
                    // 下の筆跡や背景が十分見える透明度
                    targetCtx.globalAlpha = 0.18;
                    targetCtx.lineWidth = state.lineWidth * 3;
                } else if (state.currentTool === 'eraser') {
                    // 筆跡レイヤーを透明化し、背面の背景レイヤーは変更しない
                    targetCtx.globalCompositeOperation = 'destination-out';
                    targetCtx.strokeStyle = '#000000';
                    targetCtx.fillStyle = '#000000';
                    targetCtx.lineWidth = state.eraserWidth;
                }
            }

            function draw(e) {
                if (!state.isDrawing) return;
                if (e.cancelable) e.preventDefault();

                const pos = getPointerPos(e);

                if (state.selection.mode) {
                    updateSelection(pos);
                    return;
                }

                if (state.currentTool === 'highlighter') {
                    // stroke()のたびに過去の軌跡を重ねないよう、開始時の状態から毎回1度だけ描く
                    state.currentStrokePoints.push(pos);
                    ctx.putImageData(state.snapshot, 0, 0);
                    applyToolStyle();
                    ctx.beginPath();
                    ctx.moveTo(state.currentStrokePoints[0].x, state.currentStrokePoints[0].y);
                    for (let i = 1; i < state.currentStrokePoints.length; i++) {
                        ctx.lineTo(state.currentStrokePoints[i].x, state.currentStrokePoints[i].y);
                    }
                    ctx.stroke();
                } else if (state.currentTool === 'eraser') {
                    eraseTextObjectsAt(pos);
                    [customCtx, autoInkCtx].forEach(targetCtx => {
                        targetCtx.lineTo(pos.x, pos.y);
                        targetCtx.stroke();
                    });
                } else if (state.currentTool === 'pen') {
                    ctx.lineTo(pos.x, pos.y);
                    ctx.stroke();
                } else {
                    ctx.putImageData(state.snapshot, 0, 0);
                    applyToolStyle();

                    ctx.beginPath();
                    if (state.currentTool === 'line') {
                        ctx.moveTo(state.startX, state.startY);
                        ctx.lineTo(pos.x, pos.y);
                        ctx.stroke();
                    } else if (state.currentTool === 'rect') {
                        const width = pos.x - state.startX;
                        const height = pos.y - state.startY;
                        ctx.strokeRect(state.startX, state.startY, width, height);
                    } else if (state.currentTool === 'circle') {
                        const radius = Math.hypot(pos.x - state.startX, pos.y - state.startY);
                        ctx.arc(state.startX, state.startY, radius, 0, 2 * Math.PI);
                        ctx.stroke();
                    }
                }
            }

            function stopDrawing() {
                if (state.selection.mode) {
                    finishSelection();
                    return;
                }
                if (!state.isDrawing) return;
                state.isDrawing = false;
                [customCtx, autoInkCtx].forEach(targetCtx => {
                    targetCtx.closePath();
                    targetCtx.globalAlpha = 1.0;
                    targetCtx.globalCompositeOperation = 'source-over';
                });
                state.currentStrokePoints = [];
                saveHistory();
                syncCurrentNoteToMemory(); // 自動同期
            }

            // --- テキスト入力処理 ---
            function handleTextPlacement(e) {
                const pos = getPointerPos(e);
                const editingText = findTextObjectAt(pos);
                if (!editingText) selectionOverlay.classList.add('hidden');
                const fontSize = editingText ? editingText.size : state.textSize;
                const textColor = editingText ? getTextObjectColor(editingText) : state.color;
